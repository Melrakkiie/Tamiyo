            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      summary: Change the account's display preferences
      description: Only the fields present in the body change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          description: No known field, or a field of the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}/like:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: A deck's likes, and whether you liked it
      description: Works on your own decks, whatever their visibility, and on anyone's public or unlisted deck.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LikeDeckNotFound"
    put:
      tags: [shared-decks]
      summary: Like someone else's deck
      description: Idempotent. You cannot like your own deck.
      responses:
        "200":
          description: The likes after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStatus"
        "400":
          description: The deck is yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LikeDeckNotFound"
    delete:
      tags: [shared-decks]
      summary: Remove your like
      description: Idempotent.
      responses:
        "200":
          description: The likes after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LikeDeckNotFound"

  /auth/me/liked-decks:
    get:
      tags: [shared-decks]
      summary: The decks you liked
      description: >
        Most recent like first. A liked deck its owner made private, or
        deleted, is left out.
      parameters:
