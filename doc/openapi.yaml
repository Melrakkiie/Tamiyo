openapi: 3.0.3
info:
  title: Tamiyo API
  description: >
    REST API for managing a Magic: The Gathering card collection —
    cards, physical storage (binders, boxes, deckboxes), and decks.
    Every endpoint except /health and /auth/register, /auth/login,
    /auth/refresh, /auth/logout requires a Bearer access token
    (obtained from /auth/register or /auth/login) and scopes all data
    to the authenticated user.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development (API_BASE_PATH empty)
  - url: https://tamiyo.alangelier.com/api
    description: Production (API_BASE_PATH=/api)

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: cards
  - name: storage
  - name: decks
  - name: deck-cards
    description: Deck ↔ card relationship

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Checks that the API can reach the database.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  error:
                    type: string
                required: [status, error]

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: >
        Creates a user and returns an access/refresh token pair, the same
        as /auth/login. Rate-limited per client IP (shared with
        /auth/login); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing/invalid email, or password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: >
        Returns an access/refresh token pair. Rate-limited per client IP
        (shared with /auth/register); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: >
        The submitted refresh token is single-use: a successful call
        revokes it and returns a new one. Reusing an already-rotated
        refresh token is treated as a possible theft and revokes every
        refresh token for that user, so all of that user's other sessions
        are also logged out. Exception: a token rotated out less than 10
        seconds ago, whose replacement is still valid, is accepted once
        more (the client most likely never received the response). The token is read from the JSON body, or,
        when the body has none, from the tamiyo_refresh_token cookie
        (browser clients send an empty body).
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used refresh token (the refresh cookie is cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: >
        Revokes the given refresh token so it can no longer be used to
        obtain new access tokens. Idempotent: logging out with an
        unknown or already-revoked refresh token still returns 204.
        Note this does not invalidate an access token already issued —
        it simply expires on its own shortly after (see
        JWT_ACCESS_TOKEN_TTL_MINUTES). The token is read from the JSON
        body, or from the tamiyo_refresh_token cookie when the body has
        none. The refresh cookie is always cleared.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: >
        Requires the current password. On success, every refresh token
        belonging to the user is revoked — other sessions must log in
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing current_password, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email
      description: >
        Always responds 204, whether or not the email belongs to an
        account — this prevents an attacker from using the endpoint to
        discover which emails are registered. When the account exists, a
        single-use reset token is emailed to it (valid for
        PASSWORD_RESET_TOKEN_TTL_MINUTES, 30 minutes by default). Shares
        the same rate limiter as /auth/register and /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset a password using a token from the forgot-password email
      description: >
        Consumes a single-use reset token and sets a new password. On
        success, every refresh token belonging to the account is revoked —
        all other sessions must log in again, same as /auth/password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards:
    get:
      tags: [cards]
      summary: List cards
      description: List the authenticated user's cards, with optional filtering and pagination.
      parameters:
        - name: storage_id
          in: query
          required: false
          schema:
            type: integer
          description: Only return cards belonging to this storage.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the card name.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of cards per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCards"
        "400":
          description: storage_id, page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cards]
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Missing required field, invalid UUID, invalid collector_number,
            or storage_id does not reference an existing storage owned by
            the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [cards]
      summary: Delete every card of the account
      description: >
        Deletes all of the authenticated user's cards at once: they are
        removed from every deck, and any deck whose commander was one of them
        has its commander_id cleared. Storages and decks themselves are kept.
        Requires confirm=true, so the collection can't be wiped by accident.
      parameters:
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
            enum: [true]
          description: Must be true.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllCardsResponse"
        "400":
          description: confirm=true is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      tags: [cards]
      summary: Get a card by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [cards]
      summary: Partially update a card
      description: >
        Only the fields present in the body are modified. added and
        updated can never be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Invalid id, invalid body, invalid scryfall_id, or storage_id
            does not reference an existing storage owned by the
            authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [cards]
      summary: Delete a card
      description: >
        Removes the card from any deck it belongs to, and clears
        commander_id on any deck where it was the commander.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage:
    get:
      tags: [storage]
      summary: List storages
      description: List the authenticated user's storages, with optional filtering and pagination.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return storages whose type exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of storages per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStorages"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [storage]
      summary: Create a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storage/{id}:
    parameters:
      - $ref: "#/components/parameters/StorageID"
    get:
      tags: [storage]
      summary: Get a storage by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [storage]
      summary: Partially update a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [storage]
      summary: Delete a storage
      description: >
        Any card currently in this storage has its storage_id set to null.
        Cards are never deleted as a side effect.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck:
    get:
      tags: [decks]
      summary: List decks
      description: List the authenticated user's decks, with optional filtering and pagination.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return decks whose format exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of decks per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [decks]
      summary: Create a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: >
            Missing required field, or commander_id does not reference
            an existing card owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [decks]
      summary: Get a deck by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [decks]
      summary: Partially update a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid id, invalid body, or invalid commander_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [decks]
      summary: Delete a deck
      description: >
        Removes all card_deck associations for this deck. Cards themselves
        are never deleted.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards in a deck
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK (empty array if the deck has no cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - $ref: "#/components/parameters/CardIDPath"
    put:
      tags: [deck-cards]
      summary: Add a card to a deck
      description: >
        Idempotent: calling this again with the same id/card_id succeeds
        silently if the card is already in the deck.
      responses:
        "204":
          description: No Content
        "400":
          description: id or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found or card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [deck-cards]
      summary: Remove a card from a deck
      description: >
        Idempotent: always succeeds, whether or not the card was actually
        linked to the deck, or whether the deck/card exist at all. The
        guaranteed end state is "this card is not in this deck".
      responses:
        "204":
          description: No Content
        "400":
          description: id or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/legality:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Check a deck's legality for its own format
      description: >
        Checks every card in the deck against the deck's own format field,
        using each card's Scryfall legalities. For the "commander" format
        specifically, also checks singleton (one copy of each card by
        name, basic lands excepted) and color identity (every card within
        the commander's color identity). Nothing is persisted — computed
        fresh from Scryfall data on every call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalityReport"
        "400":
          description: >
            id is not a valid integer, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Summarize a deck's composition
      description: >
        Mana curve, color breakdown and primary card types, computed from
        Scryfall data. Lands are excluded from the mana curve, color
        breakdown and average mana value, but still counted in
        card_count, land_count and type_breakdown.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"
        "400":
          description: >
            id is not a valid integer, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /import/manabox:
    post:
      tags: [bulk-import]
      summary: Bulk import a ManaBox collection export
      description: >
        Imports a ManaBox_Collection.csv export. For each row, gets or
        creates the matching storage (Binder Name/Binder Type), gets or
        creates a deck too if Binder Type is "deck" (format defaults to
        "commander" — correct it afterwards with PATCH /deck/:id if
        needed), creates one card per physical copy (Quantity), and links
        deck cards accordingly. The export already carries the Scryfall ID
        directly, so this route never calls Scryfall and never returns 502.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The ManaBox_Collection.csv file. Required columns:
                    Binder Name, Binder Type, Name, Set code, Scryfall ID,
                    Collector number, Foil, Quantity (order doesn't matter).
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: No file field, or the file couldn't be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /import/moxfield/collection:
    post:
      tags: [bulk-import]
      summary: Bulk import a Moxfield collection export
      description: >
        Imports a Moxfield "Export Collection" CSV. Moxfield's export has
        no storage concept, so every created card is assigned to the
        existing storage given by storage_id. It also has no Scryfall ID,
        so each row is resolved by (set, collector number) against the
        Scryfall API (https://scryfall.com/docs/api/cards/collection).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, storage_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The Moxfield collection CSV export. Required columns:
                    Count, Name, Edition, Foil, Collector Number (order
                    doesn't matter).
                storage_id:
                  type: integer
                  minimum: 1
                  description: Must reference an existing storage for this account.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file couldn't be parsed, or storage_id does
            not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /import/moxfield/deck:
    post:
      tags: [bulk-import]
      summary: Bulk import a Moxfield deck export
      description: >
        Imports a Moxfield deck's plain-text export (deck page -> More ->
        Export -> Plain Text). Creates one new deck and one card per
        physical copy listed, linked to it. Each line is resolved by (set,
        collector number) against Scryfall, same as the collection route.
        The plain-text format has no section headers, so by convention the
        first line is treated as the commander unless
        commander_from_first_line is set to false; an unresolvable
        commander is skipped (counted in cards_skipped) and the deck is
        still created without one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, format]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The deck's plain-text export. Each line looks like
                    "1 Sol Ring (SLD) 1011 *F*".
                name:
                  type: string
                  description: The new deck's name — the file itself doesn't carry one.
                format:
                  type: string
                  description: The new deck's format (e.g. commander, modern).
                commander_from_first_line:
                  type: boolean
                  default: true
                  description: Treat the first card line as the deck's commander.
                storage_id:
                  type: integer
                  minimum: 1
                  description: >
                    Must reference an existing storage for this account if
                    provided. Left unset, imported cards have no storage.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            Missing file/name/format, the file couldn't be parsed,
            commander_from_first_line or storage_id is invalid, or
            storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /export/manabox:
    get:
      tags: [bulk-export]
      summary: Export the collection as a ManaBox CSV
      description: >
        Exports the account's entire collection as a ManaBox-compatible
        CSV (ManaBox_Collection_export.csv), matching the columns
        POST /import/manabox reads. Identical physical copies within the
        same storage collapse into one row with a Quantity. Cards are
        grouped by storage (ManaBox's only organizing concept); a card
        with no storage is grouped under a synthetic "Unsorted" binder
        rather than dropped. A card's deck membership is tracked
        independently of storage in Tamiyo and isn't reflected here —
        only a storage whose own type is "deck" is exported as
        Binder Type "deck".
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="ManaBox_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/moxfield/collection:
    get:
      tags: [bulk-export]
      summary: Export the collection as a Moxfield collection CSV
      description: >
        Exports the account's entire collection as a Moxfield-compatible
        "Export Collection" CSV, matching the columns
        POST /import/moxfield/collection reads. Identical physical copies
        collapse into one row with a Count. Moxfield's format has no
        storage concept, so — unlike the ManaBox export — cards are
        grouped across every storage (and unsorted cards) without
        distinction.
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Moxfield_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/moxfield/deck/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [bulk-export]
      summary: Export one deck as a Moxfield deck plain-text export
      description: >
        Exports one deck (not the whole collection) as a Moxfield deck
        plain-text export, matching the format POST /import/moxfield/deck
        reads: one line per distinct printing. If the deck has a
        commander, that printing's line (with its full quantity in the
        deck) is written first, so re-importing the file reconstructs the
        same commander via the usual "first line" convention. A deck with
        no commander has no special first line — every line is sorted
        alphabetically.
      responses:
        "200":
          description: The deck's plain-text export, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Moxfield_Deck_export.txt"
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token returned by /auth/register, /auth/login or
        /auth/refresh. Short-lived (JWT_ACCESS_TOKEN_TTL_MINUTES,
        15 minutes by default) — use /auth/refresh to obtain a new one
        without logging in again.

  headers:
    RefreshCookie:
      description: >
        tamiyo_refresh_token=<refresh token>; HttpOnly; SameSite=Strict;
        Secure (unless REFRESH_COOKIE_SECURE=false); Path=<API_BASE_PATH>/auth;
        Max-Age = JWT_REFRESH_TOKEN_TTL_DAYS. Lets a browser client keep the
        refresh token out of reach of JavaScript.
      schema:
        type: string

  parameters:
    RefreshTokenTransport:
      name: X-Refresh-Token-Transport
      in: header
      required: false
      schema:
        type: string
        enum: [cookie]
      description: >
        "cookie" for browser clients that keep the refresh token in the
        httpOnly cookie only: the response body then leaves refresh_token
        out, so a script injected in the page can't read it.
    RefreshCookie:
      name: tamiyo_refresh_token
      in: cookie
      required: false
      schema:
        type: string
      description: >
        Refresh token set by /auth/register, /auth/login and /auth/refresh.
        Used when the request body carries no refresh_token.
    CardID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID
    StorageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Storage ID
    DeckID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Deck ID
    CardIDPath:
      name: card_id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID

  responses:
    InvalidID:
      description: id is not a valid integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server/database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        Too many requests from this client IP on /auth/register,
        /auth/login, and /auth/forgot-password combined
        (AUTH_RATE_LIMIT_MAX per AUTH_RATE_LIMIT_WINDOW_SECONDS, 5 per 60s
        by default). A Retry-After header (seconds) indicates when to
        retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: >
        A bulk import couldn't reach or parse a response from the
        Scryfall API while resolving Moxfield rows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LegalityIssue:
      type: object
      properties:
        card_id:
          type: integer
        card_name:
          type: string
        reason:
          type: string
      required: [card_name, reason]

    LegalityReport:
      type: object
      properties:
        format:
          type: string
        legal:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/LegalityIssue"
      required: [format, legal]

    ManaCurveBucket:
      type: object
      properties:
        mana_value:
          type: integer
        count:
          type: integer
      required: [mana_value, count]

    DeckStats:
      type: object
      properties:
        card_count:
          type: integer
        land_count:
          type: integer
        nonland_count:
          type: integer
        average_mana_value:
          type: number
        mana_curve:
          type: array
          items:
            $ref: "#/components/schemas/ManaCurveBucket"
        color_breakdown:
          type: object
          additionalProperties:
            type: integer
        type_breakdown:
          type: object
          additionalProperties:
            type: integer
      required: [card_count, land_count, nonland_count, average_mana_value, mana_curve, color_breakdown, type_breakdown]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenPair:
      type: object
      properties:
        token:
          type: string
          description: 'Short-lived JWT access token. Send as "Authorization: Bearer <token>".'
        refresh_token:
          type: string
          description: >
            Long-lived opaque token. Send to /auth/refresh to obtain a new
            token pair, or to /auth/logout to end this session. Omitted when
            the request sent "X-Refresh-Token-Transport: cookie": the token
            is then only in the tamiyo_refresh_token cookie.
      required: [token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [current_password, new_password]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [token, new_password]

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        storage_id:
          type: integer
          nullable: true
        mana_value:
          type: number
          description: Converted mana cost (CMC).
        added:
          type: string
        updated:
          type: string
      required:
        - id
        - name
        - scryfall_id
        - set_code
        - collector_number
        - foil
        - mana_value
        - added
        - updated

    DeleteAllCardsResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of cards deleted.
      required: [deleted]

    PaginatedCards:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateCardRequest:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
          default: false
        storage_id:
          type: integer
          nullable: true
          minimum: 1
        mana_value:
          type: number
          minimum: 0
          default: 0
          description: >
            Converted mana cost (CMC). Not fetched automatically from
            Scryfall — supplied by the client, same as name or set_code.
      required:
        - name
        - scryfall_id
        - set_code
        - collector_number

    UpdateCardRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        storage_id:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Moves the card to this storage. null removes the card from its
            storage; leaving the field out keeps the current one.
        mana_value:
          type: number
          minimum: 0

    Storage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        card_count:
          type: integer
        added:
          type: string
        updated:
          type: string
      required: [id, name, type, card_count, added, updated]

    PaginatedStorages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Storage"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateStorageRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required: [name, type]

    UpdateStorageRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        type:
          type: string

    Deck:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          nullable: true
        card_count:
          type: integer
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, card_count, added, updated]

    PaginatedDecks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deck"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateDeckRequest:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
      required: [name, format]

    UpdateDeckRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
        clear_commander_id:
          type: boolean
          description: Set to true to explicitly clear commander_id (set it to null).

    ImportSummary:
      type: object
      description: >
        Result of a bulk import. A malformed or unresolvable row never
        aborts the whole import — it's recorded as a skipped card with a
        warning instead.
      properties:
        cards_created:
          type: integer
        cards_skipped:
          type: integer
        storages_created:
          type: integer
        decks_created:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: Omitted entirely when there are no warnings.
