openapi: 3.0.3
info:
  title: Tamiyo API
  description: >
    REST API for managing a Magic: The Gathering card collection —
    cards, physical storage (binders, boxes, deckboxes), and decks.
    Every endpoint except /health and /auth/register, /auth/login,
    /auth/refresh, /auth/logout requires a Bearer access token
    (obtained from /auth/register or /auth/login) and scopes all data
    to the authenticated user.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: cards
  - name: storage
  - name: decks
  - name: deck-cards
    description: Deck ↔ card relationship

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Checks that the API can reach the database.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  error:
                    type: string
                required: [status, error]

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: >
        Creates a user and returns an access/refresh token pair, the same
        as /auth/login. Rate-limited per client IP (shared with
        /auth/login); see the 429 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing/invalid email, or password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: >
        Returns an access/refresh token pair. Rate-limited per client IP
        (shared with /auth/register); see the 429 response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: >
        The submitted refresh token is single-use: a successful call
        revokes it and returns a new one. Reusing an already-rotated
        refresh token is treated as a possible theft and revokes every
        refresh token for that user, so all of that user's other sessions
        are also logged out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing refresh_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: >
        Revokes the given refresh token so it can no longer be used to
        obtain new access tokens. Idempotent: logging out with an
        unknown or already-revoked refresh token still returns 204.
        Note this does not invalidate an access token already issued —
        it simply expires on its own shortly after (see
        JWT_ACCESS_TOKEN_TTL_MINUTES).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing refresh_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: >
        Requires the current password. On success, every refresh token
        belonging to the user is revoked — other sessions must log in
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing current_password, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email
      description: >
        Always responds 204, whether or not the email belongs to an
        account — this prevents an attacker from using the endpoint to
        discover which emails are registered. When the account exists, a
        single-use reset token is emailed to it (valid for
        PASSWORD_RESET_TOKEN_TTL_MINUTES, 30 minutes by default). Shares
        the same rate limiter as /auth/register and /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset a password using a token from the forgot-password email
      description: >
        Consumes a single-use reset token and sets a new password. On
        success, every refresh token belonging to the account is revoked —
        all other sessions must log in again, same as /auth/password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards:
    get:
      tags: [cards]
      summary: List cards
      description: List the authenticated user's cards, with optional filtering and pagination.
      parameters:
        - name: storage_id
          in: query
          required: false
          schema:
            type: integer
          description: Only return cards belonging to this storage.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the card name.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of cards per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCards"
        "400":
          description: storage_id, page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cards]
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Missing required field, invalid UUID, invalid collector_number,
            or storage_id does not reference an existing storage owned by
            the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      tags: [cards]
      summary: Get a card by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [cards]
      summary: Partially update a card
      description: >
        Only the fields present in the body are modified. added and
        updated can never be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Invalid id, invalid body, invalid scryfall_id, or storage_id
            does not reference an existing storage owned by the
            authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [cards]
      summary: Delete a card
      description: >
        Removes the card from any deck it belongs to, and clears
        commander_id on any deck where it was the commander.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage:
    get:
      tags: [storage]
      summary: List storages
      description: List the authenticated user's storages, with optional filtering and pagination.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return storages whose type exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of storages per page (max 100).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStorages"
        "400":
          description: page or limit is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [storage]
      summary: Create a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storage/{id}:
    parameters:
      - $ref: "#/components/parameters/StorageID"
    get:
      tags: [storage]
      summary: Get a storage by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [storage]
      summary: Partially update a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [storage]
      summary: Delete a storage
      description: >
        Any card currently in this storage has its storage_id set to null.
        Cards are never deleted as a side effect.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck:
    get:
      tags: [decks]
      summary: List decks
      description: List the authenticated user's decks, with optional filtering and pagination.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return decks whose format exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of decks per page (max 100).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: page or limit is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [decks]
      summary: Create a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: >
            Missing required field, or commander_id does not reference
            an existing card owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [decks]
      summary: Get a deck by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [decks]
      summary: Partially update a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid id, invalid body, or invalid commander_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [decks]
      summary: Delete a deck
      description: >
        Removes all card_deck associations for this deck. Cards themselves
        are never deleted.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards in a deck
      responses:
        "200":
          description: OK (empty array if the deck has no cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - $ref: "#/components/parameters/CardIDPath"
    put:
      tags: [deck-cards]
      summary: Add a card to a deck
      description: >
        Idempotent: calling this again with the same id/card_id succeeds
        silently if the card is already in the deck.
      responses:
        "204":
          description: No Content
        "400":
          description: id or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found or card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [deck-cards]
      summary: Remove a card from a deck
      description: >
        Idempotent: always succeeds, whether or not the card was actually
        linked to the deck, or whether the deck/card exist at all. The
        guaranteed end state is "this card is not in this deck".
      responses:
        "204":
          description: No Content
        "400":
          description: id or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token returned by /auth/register, /auth/login or
        /auth/refresh. Short-lived (JWT_ACCESS_TOKEN_TTL_MINUTES,
        15 minutes by default) — use /auth/refresh to obtain a new one
        without logging in again.

  parameters:
    CardID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID
    StorageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Storage ID
    DeckID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Deck ID
    CardIDPath:
      name: card_id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID

  responses:
    InvalidID:
      description: id is not a valid integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server/database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        Too many requests from this client IP on /auth/register,
        /auth/login, and /auth/forgot-password combined
        (AUTH_RATE_LIMIT_MAX per AUTH_RATE_LIMIT_WINDOW_SECONDS, 5 per 60s
        by default). A Retry-After header (seconds) indicates when to
        retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenPair:
      type: object
      properties:
        token:
          type: string
          description: 'Short-lived JWT access token. Send as "Authorization: Bearer <token>".'
        refresh_token:
          type: string
          description: >
            Long-lived opaque token. Send to /auth/refresh to obtain a new
            token pair, or to /auth/logout to end this session.
      required: [token, refresh_token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [current_password, new_password]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [token, new_password]

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        storage_id:
          type: integer
          nullable: true
        added:
          type: string
        updated:
          type: string
      required:
        - id
        - name
        - scryfall_id
        - set_code
        - collector_number
        - foil
        - added
