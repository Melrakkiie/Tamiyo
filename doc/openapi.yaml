openapi: 3.0.3
info:
  title: Tamiyo API
  description: >
    REST API for managing a Magic: The Gathering card collection —
    cards, physical storage (binders, boxes, deckboxes), and decks.
    Every endpoint except /health and /auth/register, /auth/login,
    /auth/refresh, /auth/logout requires a Bearer access token
    (obtained from /auth/register or /auth/login) and scopes all data
    to the authenticated user.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development (API_BASE_PATH empty)
  - url: https://tamiyo.alangelier.com/api
    description: Production (API_BASE_PATH=/api)

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: cards
  - name: storage
  - name: decks
  - name: users
    description: Public profiles and their public decks
  - name: deck-cards
    description: Deck ↔ card relationship
  - name: shared-decks
    description: Read-only access to public and unlisted decks by their id, without signing in

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Checks that the API can reach the database.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  error:
                    type: string
                required: [status, error]

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: >
        Creates a user and returns an access/refresh token pair, the same
        as /auth/login. Rate-limited per client IP (shared with
        /auth/login); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing/invalid email, password shorter than 8 characters, or display_name longer than 32 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: >
        Returns an access/refresh token pair. Rate-limited per client IP
        (shared with /auth/register); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: >
        The submitted refresh token is single-use: a successful call
        revokes it and returns a new one. Reusing an already-rotated
        refresh token is treated as a possible theft and revokes every
        refresh token for that user, so all of that user's other sessions
        are also logged out. Exception: a token rotated out less than 10
        seconds ago, whose replacement is still valid, is accepted once
        more (the client most likely never received the response). The token is read from the JSON body, or,
        when the body has none, from the tamiyo_refresh_token cookie
        (browser clients send an empty body).
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used refresh token (the refresh cookie is cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: >
        Revokes the given refresh token so it can no longer be used to
        obtain new access tokens. Idempotent: logging out with an
        unknown or already-revoked refresh token still returns 204.
        Note this does not invalidate an access token already issued —
        it simply expires on its own shortly after (see
        JWT_ACCESS_TOKEN_TTL_MINUTES). The token is read from the JSON
        body, or from the tamiyo_refresh_token cookie when the body has
        none. The refresh cookie is always cleared.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: >
        Requires the current password. On success, every refresh token
        belonging to the user is revoked — other sessions must log in
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing current_password, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email
      description: >
        Always responds 204, whether or not the email belongs to an
        account — this prevents an attacker from using the endpoint to
        discover which emails are registered. When the account exists, a
        single-use reset token is emailed to it (valid for
        PASSWORD_RESET_TOKEN_TTL_MINUTES, 30 minutes by default). Shares
        the same rate limiter as /auth/register and /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset a password using a token from the forgot-password email
      description: >
        Consumes a single-use reset token and sets a new password. On
        success, every refresh token belonging to the account is revoked —
        all other sessions must log in again, same as /auth/password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      tags: [auth]
      summary: The authenticated account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [auth]
      summary: Set or clear the account's display name and avatar
      description: >
        Only the fields present change; at least one is required. The
        display name is a purely cosmetic name shown instead of the email,
        not unique. The avatar is a Scryfall card id whose art crop is shown
        (only the id is stored). null or a blank string clears a field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: No field given, a field that isn't a string, display_name longer than 32 characters, or avatar_scryfall_id not a UUID. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email:
    post:
      tags: [auth]
      summary: Ask to change the authenticated user's email
      description: >
        Requires the current password. The email doesn't change yet: a
        single-use confirmation token is emailed to the current address (as
        a link when EMAIL_CHANGE_URL_TEMPLATE is set), valid for
        EMAIL_CHANGE_TOKEN_TTL_MINUTES (a day by default). The account keeps
        its current email until the token is sent to /auth/confirm-email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "202":
          description: Accepted, the confirmation email was sent
        "400":
          description: Missing field, invalid email, or new_email is the current email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: new_email already belongs to an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/confirm-email:
    post:
      tags: [auth]
      summary: Confirm an email change
      description: >
        Consumes the single-use token emailed to the current address by
        /auth/email and switches the account to the new email. A notice is
        then sent to the new address. Sessions stay open.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new email was registered by another account in the meantime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards:
    get:
      tags: [cards]
      summary: List cards
      description: List the authenticated user's cards, with optional filtering and pagination.
      parameters:
        - name: storage_id
          in: query
          required: false
          schema:
            type: integer
          description: Only return cards belonging to this storage.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the card name.
        - name: color_identity
          in: query
          required: false
          schema:
            type: string
            pattern: "^[WUBRGwubrg]*$"
          description: >
            Only return cards whose color identity fits inside these colors
            (e.g. a commander's identity), in any order. An empty value keeps
            colorless cards only. Cards whose color identity isn't known yet
            are left out.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of cards per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value, color, -color, type, -type]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
            "color" groups cards as white, blue, black, red, green, multicolor,
            colorless, lands, then cards whose colors aren't known yet; "type"
            by primary type (creature, planeswalker, battle, instant, sorcery,
            artifact, enchantment, land, other, unknown). Both sort by name
            within a group.
        - name: stack
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Return one entry per stack of identical copies (same printing,
            foil, proxy and storage) instead of one per card. Each entry is the
            stack's lowest-id copy with quantity and copy_ids set; total,
            page and limit then count stacks. added is the oldest copy's,
            updated the most recent one's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCards"
        "400":
          description: storage_id, page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cards]
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Missing required field, invalid UUID, invalid collector_number,
            or storage_id does not reference an existing storage owned by
            the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [cards]
      summary: Delete every card of the account
      description: >
        Deletes all of the authenticated user's cards at once: every deck
        keeps its cards in its pending list, its commander included (as
        commander_pending_id). Storages and decks themselves are kept.
        Requires confirm=true, so the collection can't be wiped by accident.
      parameters:
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
            enum: [true]
          description: Must be true.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllCardsResponse"
        "400":
          description: confirm=true is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards/refresh-details:
    post:
      tags: [cards]
      summary: Fill in missing colors and types from Scryfall
      description: >
        Looks up on Scryfall the cards of the account whose colors,
        card_type or color_identity aren't known yet (cards created before they were stored,
        or imported while Scryfall was unreachable), and stores their colors,
        primary type, color identity and mana value. Works through at most 750 cards per
        call, in id order, so a call stays short: while next_after_id is
        not null, call again with after_id set to it.
      parameters:
        - name: after_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Only look at cards with a greater id (the next_after_id of the previous call).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailsRefreshSummary"
        "400":
          description: after_id is not a non-negative integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      tags: [cards]
      summary: Get a card by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [cards]
      summary: Partially update a card
      description: >
        Only the fields present in the body are modified. added and
        updated can never be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Invalid id, invalid body, invalid scryfall_id, or storage_id
            does not reference an existing storage owned by the
            authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [cards]
      summary: Delete a card
      description: >
        Removes the card from the collection. Each deck it was in gets it back
        in its pending list (to add to the collection again later); a deck
        whose commander it was keeps it as commander_pending_id.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage:
    get:
      tags: [storage]
      summary: List storages
      description: List the authenticated user's storages, with optional filtering and pagination.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return storages whose type exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of storages per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStorages"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [storage]
      summary: Create a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storage/{id}:
    parameters:
      - $ref: "#/components/parameters/StorageID"
    get:
      tags: [storage]
      summary: Get a storage by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [storage]
      summary: Partially update a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [storage]
      summary: Delete a storage
      description: >
        Any card currently in this storage has its storage_id set to null.
        Cards are never deleted as a side effect.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    get:
      tags: [users]
      summary: A user's public profile
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}/decks:
    get:
      tags: [users]
      summary: A user's public decks
      description: >
        Decks whose visibility is public, with the same pagination, sort and
        response shape as GET /deck. An unknown user simply has no decks.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: id is not a UUID, or invalid page, limit or sort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck:
    get:
      tags: [decks]
      summary: List decks
      description: List the authenticated user's decks, with optional filtering and pagination.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return decks whose format exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of decks per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [decks]
      summary: Create a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: >
            Missing required field, or commander_id does not reference
            an existing card owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [decks]
      summary: Get a deck by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [decks]
      summary: Partially update a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid id, invalid body, or invalid commander_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [decks]
      summary: Delete a deck
      description: >
        Removes all card_deck associations for this deck. Cards themselves
        are never deleted.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards in a deck
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK (empty array if the deck has no cards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - $ref: "#/components/parameters/CardIDPath"
    put:
      tags: [deck-cards]
      summary: Add a card to a deck
      description: >
        Idempotent: calling this again with the same id/card_id succeeds
        silently if the card is already in the deck.
      responses:
        "204":
          description: No Content
        "400":
          description: id is not a UUID, or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found or card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [deck-cards]
      summary: Remove a card from a deck
      description: >
        Idempotent: always succeeds, whether or not the card was actually
        linked to the deck, or whether the deck/card exist at all. The
        guaranteed end state is "this card is not in this deck".
      responses:
        "204":
          description: No Content
        "400":
          description: id is not a UUID, or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/pending:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards waiting to be added to the collection for this deck
      description: >
        Cards picked on Scryfall for this deck but not in the collection yet,
        sorted by name. POST /deck/{id}/pending/commit creates them in the
        collection and puts them in the deck.
      responses:
        "200":
          description: OK (empty array when nothing is pending)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingCard"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [deck-cards]
      summary: Add a card to the deck's pending list
      description: >
        When the deck already has a pending card of the same printing and
        finish (other than its pending commander), its quantity is raised
        instead, and that item is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPendingCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCard"
        "400":
          description: Invalid id or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/pending/{pending_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - name: pending_id
        in: path
        required: true
        schema:
          type: integer
        description: Pending card ID
    patch:
      tags: [deck-cards]
      summary: Change how many copies a pending card stands for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCard"
        "400":
          description: Invalid id, pending_id or quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck or pending card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [deck-cards]
      summary: Remove a card from the deck's pending list
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck or pending card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/pending/commit:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Create the pending cards in the collection and put them in the deck
      description: >
        Creates one card per copy of every pending card (or only the one
        given as pending_id), in the given storage (or without storage),
        adds each one to the deck, and removes it from the pending list. Items are handled one at a time: if something fails,
        the items already handled stay done and the rest stay pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                storage_id:
                  type: integer
                  minimum: 1
                  nullable: true
                pending_id:
                  type: integer
                  minimum: 1
                  description: Only add this pending card (all its copies) instead of the whole list.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    With pending_id, only add this many copies; the pending
                    card keeps the rest. More than it holds adds them all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCommitSummary"
        "400":
          description: Invalid id or body, or storage_id doesn't reference an existing storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found (or not owned by the authenticated user), or unknown pending_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/import:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Add a list of cards to an existing deck
      description: >
        Adds a decklist to this deck, without ever creating cards in the
        collection. Accepts a Moxfield plain-text export ("1 Sol Ring (SLD)
        1011 *F*", resolved by set and collector number against Scryfall),
        a plain "4 Lightning Bolt" list (resolved by name, any owned
        printing can be used, missing copies are added in Scryfall's
        default printing), or a mix of both; section headers such as
        Commander or Deck are skipped. Owned copies go in the deck
        (cards_linked), copies in no deck and of the same finish first,
        each copy used once and copies already in this deck never used
        twice; missing copies become pending cards (cards_pending). With
        commander_from_first_line, the first card line becomes the
        commander only if the deck has none yet: an owned one becomes
        commander_id, a missing one the pending commander.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The list, one card per line.
                commander_from_first_line:
                  type: boolean
                  default: false
                  description: Treat the first line as the commander when the deck has none.
      responses:
        "200":
          description: Cards added (possibly with some lines skipped — see ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: id is not a UUID, the file is missing or can't be parsed, or commander_from_first_line is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/legality:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Check a deck's legality for its own format
      description: >
        Checks every card in the deck against the deck's own format field,
        using each card's Scryfall legalities. For the "commander" format
        specifically, also checks singleton (one copy of each card by
        name, basic lands excepted) and color identity (every card within
        the commander's color identity). Nothing is persisted — computed
        fresh from Scryfall data on every call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalityReport"
        "400":
          description: >
            id is not a UUID, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Summarize a deck's composition
      description: >
        Mana curve, color breakdown and primary card types, computed from
        Scryfall data. Lands are excluded from the mana curve, color
        breakdown and average mana value, but still counted in
        card_count, land_count and type_breakdown.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"
        "400":
          description: >
            id is not a UUID, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: A shared deck, its owner and its cards
      description: >
        Works without authentication. Resolves only public and unlisted
        decks. Owned copies and pending cards are merged into one list,
        with no storage, proxy or ownership details.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDeck"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /shared/decks/{id}/legality:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: Legality of a shared deck
      description: >
        Same report as GET /deck/{id}/legality, without card ids. Works
        without authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalityReport"
        "400":
          description: The deck's format isn't one Scryfall recognizes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: Statistics of a shared deck
      description: Same statistics as GET /deck/{id}/stats. Works without authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"
        "400":
          description: The deck's format isn't one Scryfall recognizes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /import/manabox:
    post:
      tags: [bulk-import]
      summary: Bulk import a ManaBox collection export
      description: >
        Imports a ManaBox_Collection.csv export. For each row, gets or
        creates the matching storage (Binder Name/Binder Type), gets or
        creates a deck too if Binder Type is "deck" (format defaults to
        "commander" — correct it afterwards with PATCH /deck/:id if
        needed), creates one card per physical copy (Quantity), and links
        deck cards accordingly. The export already carries the Scryfall ID
        directly, so this route never calls Scryfall and never returns 502.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The ManaBox_Collection.csv file. Required columns:
                    Binder Name, Binder Type, Name, Set code, Scryfall ID,
                    Collector number, Foil, Quantity (order doesn't matter).
                storage_id:
                  type: integer
                  minimum: 1
                  description: >
                    Put every card in this existing storage instead:
                    Binder Name and Binder Type are then ignored, and no
                    storage or deck is created.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file couldn't be parsed, or storage_id is
            invalid or does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /import/moxfield/collection:
    post:
      tags: [bulk-import]
      summary: Bulk import a Moxfield collection export
      description: >
        Imports a Moxfield "Export Collection" CSV. Moxfield's export has
        no storage concept, so every created card is assigned to the
        existing storage given by storage_id. It also has no Scryfall ID,
        so each row is resolved by (set, collector number) against the
        Scryfall API (https://scryfall.com/docs/api/cards/collection).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, storage_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The Moxfield collection CSV export. Required columns:
                    Count, Name, Edition, Foil, Collector Number (order
                    doesn't matter).
                storage_id:
                  type: integer
                  minimum: 1
                  description: Must reference an existing storage for this account.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file couldn't be parsed, or storage_id does
            not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /export/manabox:
    get:
      tags: [bulk-export]
      summary: Export the collection as a ManaBox CSV
      description: >
        Exports the account's collection, or only one storage with
        storage_id, as a ManaBox-compatible CSV (ManaBox_Collection_export.csv), matching the columns
        POST /import/manabox reads. Identical physical copies within the
        same storage collapse into one row with a Quantity. Cards are
        grouped by storage (ManaBox's only organizing concept); a card
        with no storage is grouped under a synthetic "Unsorted" binder
        rather than dropped. A card's deck membership is tracked
        independently of storage in Tamiyo and isn't reflected here —
        only a storage whose own type is "deck" is exported as
        Binder Type "deck".
      parameters:
        - name: storage_id
          in: query
          required: false
          description: Only export the cards in this storage.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="ManaBox_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: storage_id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/moxfield/collection:
    get:
      tags: [bulk-export]
      summary: Export the collection as a Moxfield collection CSV
      description: >
        Exports the account's collection, or only one storage with
        storage_id, as a Moxfield-compatible "Export Collection" CSV, matching the columns
        POST /import/moxfield/collection reads. Identical physical copies
        collapse into one row with a Count. Moxfield's format has no
        storage concept, so — unlike the ManaBox export — cards are
        grouped across every storage (and unsorted cards) without
        distinction.
      parameters:
        - name: storage_id
          in: query
          required: false
          description: Only export the cards in this storage.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Moxfield_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: storage_id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/export:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [bulk-export]
      summary: Export one deck as text, in a chosen format
      description: >
        Exports the deck's cards, pending ones included, as plain text.
        moxfield: one line per printing, "1 Sol Ring (SLD) 1011 *F*", the
        commander's line first with its full quantity, the rest sorted
        alphabetically, so importing the file back reconstructs the same
        commander. plain: one line per card name, "4 Lightning Bolt",
        the commander first. arena: MTG Arena's format, a "Commander"
        section (when the deck has one) then a "Deck" section, one line per
        card name, split cards written with " // ".
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [moxfield, plain, arena]
            default: moxfield
      responses:
        "200":
          description: The deck as text, served as a download (Deck_moxfield.txt, Deck_list.txt or Deck_arena.txt).
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Deck_list.txt"
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "400":
          description: id is not a UUID, or format is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token returned by /auth/register, /auth/login or
        /auth/refresh. Short-lived (JWT_ACCESS_TOKEN_TTL_MINUTES,
        15 minutes by default) — use /auth/refresh to obtain a new one
        without logging in again.

  headers:
    RefreshCookie:
      description: >
        tamiyo_refresh_token=<refresh token>; HttpOnly; SameSite=Strict;
        Secure (unless REFRESH_COOKIE_SECURE=false); Path=<API_BASE_PATH>/auth;
        Max-Age = JWT_REFRESH_TOKEN_TTL_DAYS. Lets a browser client keep the
        refresh token out of reach of JavaScript.
      schema:
        type: string

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshTokenTransport:
      name: X-Refresh-Token-Transport
      in: header
      required: false
      schema:
        type: string
        enum: [cookie]
      description: >
        "cookie" for browser clients that keep the refresh token in the
        httpOnly cookie only: the response body then leaves refresh_token
        out, so a script injected in the page can't read it.
    RefreshCookie:
      name: tamiyo_refresh_token
      in: cookie
      required: false
      schema:
        type: string
      description: >
        Refresh token set by /auth/register, /auth/login and /auth/refresh.
        Used when the request body carries no refresh_token.
    CardID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID
    StorageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Storage ID
    DeckID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Deck ID (a UUID)
    CardIDPath:
      name: card_id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID

  responses:
    InvalidID:
      description: id is not a valid integer (a UUID for decks)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server/database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        Too many requests from this client IP on /auth/register,
        /auth/login, and /auth/forgot-password combined
        (AUTH_RATE_LIMIT_MAX per AUTH_RATE_LIMIT_WINDOW_SECONDS, 5 per 60s
        by default). A Retry-After header (seconds) indicates when to
        retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SharedTooManyRequests:
      description: >
        Too many requests from this client IP on the /shared/decks routes
        combined (SHARE_RATE_LIMIT_MAX per SHARE_RATE_LIMIT_WINDOW_SECONDS,
        60 per 60s by default). A Retry-After header (seconds) indicates
        when to retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: >
        A bulk import couldn't reach or parse a response from the
        Scryfall API while resolving Moxfield rows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LegalityIssue:
      type: object
      properties:
        card_id:
          type: integer
        card_name:
          type: string
          description: Empty for an issue about the whole deck, such as its size.
        reason:
          type: string
      required: [card_name, reason]

    LegalityReport:
      type: object
      properties:
        format:
          type: string
        legal:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/LegalityIssue"
      required: [format, legal]

    ManaCurveBucket:
      type: object
      properties:
        mana_value:
          type: integer
        count:
          type: integer
      required: [mana_value, count]

    DeckStats:
      type: object
      properties:
        card_count:
          type: integer
        land_count:
          type: integer
        nonland_count:
          type: integer
        average_mana_value:
          type: number
        mana_curve:
          type: array
          items:
            $ref: "#/components/schemas/ManaCurveBucket"
        color_breakdown:
          type: object
          additionalProperties:
            type: integer
        type_breakdown:
          type: object
          additionalProperties:
            type: integer
      required: [card_count, land_count, nonland_count, average_mana_value, mana_curve, color_breakdown, type_breakdown]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Optional cosmetic name, trimmed; blank means none.
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenPair:
      type: object
      properties:
        token:
          type: string
          description: 'Short-lived JWT access token. Send as "Authorization: Bearer <token>".'
        refresh_token:
          type: string
          description: >
            Long-lived opaque token. Send to /auth/refresh to obtain a new
            token pair, or to /auth/logout to end this session. Omitted when
            the request sent "X-Refresh-Token-Transport: cookie": the token
            is then only in the tamiyo_refresh_token cookie.
      required: [token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [current_password, new_password]

    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Cosmetic name shown instead of the email, null until set.
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: Scryfall card whose art crop is the avatar, null until set.
      required: [id, email, display_name, avatar_scryfall_id]

    Profile:
      type: object
      description: What any signed-in user can see of another user; never the email.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
      required: [id, display_name, avatar_scryfall_id]

    UpdateMeRequest:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Trimmed; null or a blank string clears it.
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: Scryfall card id whose art crop becomes the avatar; null or a blank string clears it.

    ChangeEmailRequest:
      type: object
      properties:
        current_password:
          type: string
        new_email:
          type: string
          format: email
      required: [current_password, new_email]

    ConfirmEmailRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [token, new_password]

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        proxy:
          type: boolean
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          nullable: true
        mana_value:
          type: number
          description: Converted mana cost (CMC).
        colors:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            The card's colors as WUBRG letters in that order ("WR" for a
            Boros card), empty for a colorless card, null when not known yet
            (see POST /cards/refresh-details).
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
          description: >
            Primary type, from the type line of the front face (lands first, then creatures,
            planeswalkers...). null when not known yet.
        color_identity:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            Color identity as WUBRG letters in that order, empty for a
            colorless card, null when not known yet (see
            POST /cards/refresh-details).
        added:
          type: string
        updated:
          type: string
        quantity:
          type: integer
          description: Only with GET /cards?stack=true, the number of copies in the stack.
        copy_ids:
          type: array
          items:
            type: integer
          description: Only with GET /cards?stack=true, the ids of the stack's copies, lowest first.
      required:
        - id
        - name
        - scryfall_id
        - set_code
        - collector_number
        - foil
        - mana_value
        - added
        - updated

    PendingCard:
      type: object
      properties:
        id:
          type: integer
        deck_id:
          type: string
          format: uuid
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
        mana_value:
          type: number
        colors:
          type: string
          nullable: true
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          nullable: true
        added:
          type: string
      required: [id, deck_id, name, scryfall_id, set_code, collector_number, foil, quantity, mana_value, added]

    AddPendingCardRequest:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        mana_value:
          type: number
          minimum: 0
        colors:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
      required: [name, scryfall_id, set_code, collector_number]

    PendingCommitSummary:
      type: object
      properties:
        cards_created:
          type: integer
      required: [cards_created]

    DetailsRefreshSummary:
      type: object
      properties:
        updated:
          type: integer
          description: Cards whose details were filled in.
        not_found:
          type: integer
          description: Cards Scryfall didn't know (their details stay unknown).
        remaining:
          type: integer
          description: Cards still missing details after this batch.
        next_after_id:
          type: integer
          nullable: true
          description: after_id to send on the next call, null when there is nothing left.
      required: [updated, not_found, remaining, next_after_id]

    DeleteAllCardsResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of cards deleted.
      required: [deleted]

    PaginatedCards:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateCardRequest:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
          default: false
        proxy:
          type: boolean
          default: false
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          nullable: true
          minimum: 1
        mana_value:
          type: number
          minimum: 0
          default: 0
          description: >
            Converted mana cost (CMC). Not fetched automatically from
            Scryfall — supplied by the client, same as name or set_code.
        colors:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            WUBRG letters (any case and order, normalized to WUBRG order),
            empty for colorless. Optional: left unknown when omitted.
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
          description: Primary type. Optional, left unknown when omitted.
        color_identity:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
          description: >
            WUBRG letters (any case and order, normalized to WUBRG order),
            empty for colorless. Optional: left unknown when omitted.
      required:
        - name
        - scryfall_id
        - set_code
        - collector_number

    UpdateCardRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        proxy:
          type: boolean
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Moves the card to this storage. null removes the card from its
            storage; leaving the field out keeps the current one.
        mana_value:
          type: number
          minimum: 0
        colors:
          type: string
          pattern: "^[WUBRGwubrg]*$"
        card_type:
          type: string
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          pattern: "^[WUBRGwubrg]*$"

    Storage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        card_count:
          type: integer
        added:
          type: string
        updated:
          type: string
      required: [id, name, type, card_count, added, updated]

    PaginatedStorages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Storage"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateStorageRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required: [name, type]

    UpdateStorageRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        type:
          type: string

    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            Random identifier generated when the deck is created. It is also
            the id of the deck's read-only page (GET /shared/decks/{id}),
            which only resolves while the deck is public or unlisted.
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          nullable: true
        commander_pending_id:
          type: integer
          nullable: true
          description: >
            The commander when it's one of the deck's pending cards (not in
            the collection yet). At most one of commander_id and
            commander_pending_id is set.
        background_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Scryfall id of the printing whose art (art_crop) is shown behind
            the deck, null when none was chosen.
        commander_scryfall_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: Scryfall id of the commander card, null without a commander.
        visibility:
          $ref: "#/components/schemas/DeckVisibility"
        card_count:
          type: integer
        pending_count:
          type: integer
          description: Copies waiting in the deck's pending list (not in the collection yet), not counted in card_count.
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, visibility, card_count, added, updated]

    SharedDeckInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
        visibility:
          type: string
          enum: [public, unlisted]
        background_scryfall_id:
          type: string
          format: uuid
          nullable: true
        commander_scryfall_id:
          type: string
          format: uuid
          nullable: true
        card_count:
          type: integer
          description: Every card of the deck, owned or pending.
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, visibility, background_scryfall_id, commander_scryfall_id, card_count, added, updated]

    SharedDeckCard:
      type: object
      description: One printing of a card in a shared deck, with how many copies the deck holds.
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
          minimum: 1
        mana_value:
          type: number
        colors:
          type: string
          nullable: true
        card_type:
          type: string
          nullable: true
        color_identity:
          type: string
          nullable: true
        commander:
          type: boolean
          description: True for the deck's commander, which is always listed on its own.
      required: [name, scryfall_id, set_code, collector_number, foil, quantity, mana_value, colors, card_type, color_identity, commander]

    SharedDeck:
      type: object
      properties:
        deck:
          $ref: "#/components/schemas/SharedDeckInfo"
        owner:
          $ref: "#/components/schemas/Profile"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/SharedDeckCard"
      required: [deck, owner, cards]

    PaginatedDecks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deck"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateDeckRequest:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
        background_scryfall_id:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/DeckVisibility"
      required: [name, format]

    UpdateDeckRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
        commander_pending_id:
          type: integer
          minimum: 1
          description: >
            Make one of the deck's pending cards the commander (clears
            commander_id). Setting commander_id clears it in turn.
        clear_commander_id:
          type: boolean
          description: Set to true to explicitly clear commander_id (set it to null).
        background_scryfall_id:
          type: string
          format: uuid
        clear_background_scryfall_id:
          type: boolean
          description: Set to true to remove the chosen art (set background_scryfall_id to null).
        visibility:
          $ref: "#/components/schemas/DeckVisibility"

    DeckVisibility:
      type: string
      enum: [private, unlisted, public]
      default: unlisted
      description: >
        Who may see the deck once decks can be shared: only its owner
        (private), anyone with its link (unlisted), or anyone, listed when
        browsing decks (public). No effect yet: deck routes only serve the
        owner's decks.

    ImportSummary:
      type: object
      description: >
        Result of a bulk import. A malformed or unresolvable row never
        aborts the whole import — it's recorded as a skipped card with a
        warning instead.
      properties:
        cards_created:
          type: integer
        cards_linked:
          type: integer
          description: Deck import only — copies from the collection put in the deck.
        cards_pending:
          type: integer
          description: Deck import only — copies added to the deck's pending cards.
        cards_skipped:
          type: integer
        storages_created:
          type: integer
        decks_created:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: Omitted entirely when there are no warnings.
