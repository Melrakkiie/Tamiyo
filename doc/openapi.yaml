openapi: 3.0.3
info:
  title: Tamiyo API
  description: >
    REST API for managing a Magic: The Gathering card collection —
    cards, physical storage (binders, boxes, deckboxes), and decks.
    Every endpoint except /health and /auth/register, /auth/login,
    /auth/refresh, /auth/logout requires a Bearer access token
    (obtained from /auth/register or /auth/login) and scopes all data
    to the authenticated user.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development (API_BASE_PATH empty)
  - url: https://tamiyo.alangelier.com/api
    description: Production (API_BASE_PATH=/api)

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: cards
  - name: storage
  - name: decks
  - name: users
    description: Public profiles and their public decks
  - name: deck-cards
    description: Deck ↔ card relationship
  - name: shared-decks
    description: Read-only access to public and unlisted decks by their id, without signing in, and deck comparison for signed-in users

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Checks that the API can reach the database.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "503":
          description: The database is not reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unavailable
                  error:
                    type: string
                required: [status, error]

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: >
        Creates a user and returns an access/refresh token pair, the same
        as /auth/login. Rate-limited per client IP (shared with
        /auth/login); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Missing/invalid email, password shorter than 8 characters, or display_name longer than 32 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: >
        Returns an access/refresh token pair. Rate-limited per client IP
        (shared with /auth/register); see the 429 response.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      description: >
        The submitted refresh token is single-use: a successful call
        revokes it and returns a new one. Reusing an already-rotated
        refresh token is treated as a possible theft and revokes every
        refresh token for that user, so all of that user's other sessions
        are also logged out. Exception: a token rotated out less than 10
        seconds ago, whose replacement is still valid, is accepted once
        more (the client most likely never received the response). The token is read from the JSON body, or,
        when the body has none, from the tamiyo_refresh_token cookie
        (browser clients send an empty body).
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
        - $ref: "#/components/parameters/RefreshTokenTransport"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used refresh token (the refresh cookie is cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: >
        Revokes the given refresh token so it can no longer be used to
        obtain new access tokens. Idempotent: logging out with an
        unknown or already-revoked refresh token still returns 204.
        Note this does not invalidate an access token already issued —
        it simply expires on its own shortly after (see
        JWT_ACCESS_TOKEN_TTL_MINUTES). The token is read from the JSON
        body, or from the tamiyo_refresh_token cookie when the body has
        none. The refresh cookie is always cleared.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Refresh token in neither the body nor the cookie, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      description: >
        Requires the current password. On success, every refresh token
        belonging to the user is revoked — other sessions must log in
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing current_password, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password reset email
      description: >
        Always responds 204, whether or not the email belongs to an
        account — this prevents an attacker from using the endpoint to
        discover which emails are registered. When the account exists, a
        single-use reset token is emailed to it (valid for
        PASSWORD_RESET_TOKEN_TTL_MINUTES, 30 minutes by default). Shares
        the same rate limiter as /auth/register and /auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset a password using a token from the forgot-password email
      description: >
        Consumes a single-use reset token and sets a new password. On
        success, every refresh token belonging to the account is revoked —
        all other sessions must log in again, same as /auth/password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token, or new_password shorter than 8 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      tags: [auth]
      summary: The authenticated account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [auth]
      summary: Set or clear the account's display name and avatar
      description: >
        Only the fields present change; at least one is required. The
        display name is a purely cosmetic name shown instead of the email,
        not unique. The avatar is a Scryfall card id whose art crop is shown
        (only the id is stored). null or a blank string clears a field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: No field given, a field that isn't a string, display_name longer than 32 characters, or avatar_scryfall_id not a UUID. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/email:
    post:
      tags: [auth]
      summary: Ask to change the authenticated user's email
      description: >
        Requires the current password. The email doesn't change yet: a
        single-use confirmation token is emailed to the current address (as
        a link when EMAIL_CHANGE_URL_TEMPLATE is set), valid for
        EMAIL_CHANGE_TOKEN_TTL_MINUTES (a day by default). The account keeps
        its current email until the token is sent to /auth/confirm-email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "202":
          description: Accepted, the confirmation email was sent
        "400":
          description: Missing field, invalid email, or new_email is the current email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token, or current_password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: new_email already belongs to an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/confirm-email:
    post:
      tags: [auth]
      summary: Confirm an email change
      description: >
        Consumes the single-use token emailed to the current address by
        /auth/email and switches the account to the new email. A notice is
        then sent to the new address. Sessions stay open.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new email was registered by another account in the meantime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards:
    get:
      tags: [cards]
      summary: List cards
      description: List the authenticated user's cards, with optional filtering and pagination.
      parameters:
        - name: storage_id
          in: query
          required: false
          schema:
            type: integer
          description: Only return cards belonging to this storage.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the card name.
        - name: color_identity
          in: query
          required: false
          schema:
            type: string
            pattern: "^[WUBRGwubrg]*$"
          description: >
            Only return cards whose color identity fits inside these colors
            (e.g. a commander's identity), in any order. An empty value keeps
            colorless cards only. Cards whose color identity isn't known yet
            are left out.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of cards per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value, color, -color, type, -type]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
        - name: colors
          in: query
          required: false
          schema:
            type: string
          description: WUBRG letters, read with color_mode. Cards whose colors aren't known are left out.
        - name: color_mode
          in: query
          required: false
          schema:
            type: string
            enum: [exact, include, within]
            default: exact
          description: >
            exact (exactly these colors; an empty colors keeps colorless
            cards), include (at least these colors) or within (only colors
            among these, colorless included).
        - name: mana_value
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: mana_value_op
          in: query
          required: false
          schema:
            type: string
            enum: [eq, lt, lte, gt, gte]
            default: eq
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land]
          description: >
            Matches the primary type and any type of the card's type line
            (fetched from Scryfall in the background).
        - name: subtype
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
          description: Part of the subtypes, after the dash of the type line, case-insensitive.
        - name: legal_in
          in: query
          required: false
          schema:
            type: string
          description: >
            A Scryfall format (commander, modern, pioneer…): only cards legal
            or restricted in it. Legalities are refreshed daily.
        - name: color_count
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
        - name: foil
          in: query
          required: false
          schema:
            type: boolean
        - name: storage_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
          description: Only cards in a storage of this type, case-insensitive.
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [type, color, mana]
          description: >
            Order the cards by group first (primary type, color group as
            for sort=color, or mana value rounded down), then by sort within
            each group, so a client can show grouped pages sorted its way.
            "color" groups cards as white, blue, black, red, green, multicolor,
            colorless, lands, then cards whose colors aren't known yet; "type"
            by primary type (creature, planeswalker, battle, instant, sorcery,
            artifact, enchantment, land, other, unknown). Both sort by name
            within a group.
        - name: stack
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Return one entry per stack of identical copies (same printing,
            foil, proxy and storage) instead of one per card. Each entry is the
            stack's lowest-id copy with quantity and copy_ids set; total,
            page and limit then count stacks. added is the oldest copy's,
            updated the most recent one's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCards"
        "400":
          description: storage_id, page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [cards]
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Missing required field, invalid UUID, invalid collector_number,
            or storage_id does not reference an existing storage owned by
            the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [cards]
      summary: Delete every card of the account
      description: >
        Deletes all of the authenticated user's cards at once: every deck
        keeps its cards in its pending list, its commander included (as
        commander_pending_id). Storages and decks themselves are kept.
        Requires confirm=true, so the collection can't be wiped by accident.
      parameters:
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
            enum: [true]
          description: Must be true.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllCardsResponse"
        "400":
          description: confirm=true is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /cards/refresh-details:
    post:
      tags: [cards]
      summary: Fill in missing colors and types from Scryfall
      description: >
        Looks up on Scryfall the cards of the account whose colors,
        card_type or color_identity aren't known yet (cards created before they were stored,
        or imported while Scryfall was unreachable), and stores their colors,
        primary type, color identity and mana value. Works through at most 750 cards per
        call, in id order, so a call stays short: while next_after_id is
        not null, call again with after_id set to it.
      parameters:
        - name: after_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Only look at cards with a greater id (the next_after_id of the previous call).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailsRefreshSummary"
        "400":
          description: after_id is not a non-negative integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/CardID"
    get:
      tags: [cards]
      summary: Get a card by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [cards]
      summary: Partially update a card
      description: >
        Only the fields present in the body are modified. added and
        updated can never be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          description: >
            Invalid id, invalid body, invalid scryfall_id, or storage_id
            does not reference an existing storage owned by the
            authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [cards]
      summary: Delete a card
      description: >
        Removes the card from the collection. Each deck it was in gets it back
        in its pending list (to add to the collection again later); a deck
        whose commander it was keeps it as commander_pending_id.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Card not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage:
    get:
      tags: [storage]
      summary: List storages
      description: List the authenticated user's storages, with optional filtering and pagination.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return storages whose type exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of storages per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStorages"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [storage]
      summary: Create a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storage/{id}:
    parameters:
      - $ref: "#/components/parameters/StorageID"
    get:
      tags: [storage]
      summary: Get a storage by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [storage]
      summary: Partially update a storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [storage]
      summary: Delete a storage
      description: >
        Any card currently in this storage has its storage_id set to null.
        Cards are never deleted as a side effect.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Storage not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    get:
      tags: [users]
      summary: A user's public profile
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}/decks:
    get:
      tags: [users]
      summary: A user's public decks
      description: >
        Decks whose visibility is public, with the same pagination, sort and
        response shape as GET /deck. An unknown user simply has no decks.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: id is not a UUID, or invalid page, limit or sort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/follow:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [users]
      summary: A user's follow counts and how they relate to you
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
        "400":
          $ref: "#/components/responses/FollowBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
    put:
      tags: [users]
      summary: Follow a user
      description: Idempotent. You cannot follow yourself.
      responses:
        "200":
          description: The follow status after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
        "400":
          $ref: "#/components/responses/FollowBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
    delete:
      tags: [users]
      summary: Stop following a user
      description: Idempotent.
      responses:
        "200":
          description: The follow status after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
        "400":
          $ref: "#/components/responses/FollowBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /users/{id}/followers:
    get:
      tags: [users]
      summary: The users following a user
      description: Most recent first.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/ConnectionsPage"
        - $ref: "#/components/parameters/ConnectionsLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedConnections"
        "400":
          $ref: "#/components/responses/FollowBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /users/{id}/following:
    get:
      tags: [users]
      summary: The users a user follows
      description: Most recent first.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/ConnectionsPage"
        - $ref: "#/components/parameters/ConnectionsLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedConnections"
        "400":
          $ref: "#/components/responses/FollowBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /deck:
    get:
      tags: [decks]
      summary: List decks
      description: List the authenticated user's decks, with optional filtering and pagination.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: >
            Only return decks whose format exactly matches (case-insensitive).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of decks per page (max 100).
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDecks"
        "400":
          description: page or limit is invalid, or sort is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [decks]
      summary: Create a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: >
            Missing required field, or commander_id does not reference
            an existing card owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [decks]
      summary: Get a deck by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [decks]
      summary: Partially update a deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Invalid id, invalid body, or invalid commander_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [decks]
      summary: Delete a deck
      description: >
        Removes all card_deck associations for this deck. Cards themselves
        are never deleted.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards in a deck
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value]
            default: -updated
          description: >
            Sort field, with an optional "-" prefix for descending order.
            id is always used as a secondary tie-breaker for a stable order.
      responses:
        "200":
          description: OK (empty array if the deck has no cards). Every board is returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckCard"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - $ref: "#/components/parameters/CardIDPath"
    put:
      tags: [deck-cards]
      summary: Add a card to a deck, or move it to another board
      description: >
        Idempotent: calling this again with the same id/card_id and board
        succeeds silently. A card already in the deck is moved to the given
        board. The deck's commander can't leave the main board.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                board:
                  $ref: "#/components/schemas/DeckBoard"
      responses:
        "204":
          description: No Content
        "400":
          description: id is not a UUID, card_id is not a valid integer, or board is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found or card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The card is the deck's commander and board isn't main
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [deck-cards]
      summary: Remove a card from a deck
      description: >
        Idempotent: always succeeds, whether or not the card was actually
        linked to the deck, or whether the deck/card exist at all. The
        guaranteed end state is "this card is not in this deck".
      responses:
        "204":
          description: No Content
        "400":
          description: id is not a UUID, or card_id is not a valid integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/view:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [decks]
      summary: The owner's display settings for the deck page
      description: >
        Grouping and sort the owner last used to display the deck's cards.
        Defaults to grouping by type, sorted by mana value, until saved.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckView"
        "400":
          description: id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found (or not owned by the authenticated user).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [decks]
      summary: Save the owner's display settings for the deck page
      description: Doesn't change the deck's updated date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckView"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckView"
        "400":
          description: Invalid id, missing sort, or unknown grouping or sort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found (or not owned by the authenticated user).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the deck's card tags
      description: >
        Every tag used in the deck and the tagged cards (untagged ones are
        left out), sorted alphabetically ignoring case. A tag belongs to a
        card name within the deck: every copy shares it, pending ones
        included, whatever the printing. Tags of cards no longer in the
        deck are kept but not returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckTags"
        "400":
          description: id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found (or not owned by the authenticated user).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [deck-cards]
      summary: Rename a tag on every card of the deck
      description: >
        Renaming into a tag the deck already uses (ignoring case) merges
        the two.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "204":
          description: Renamed
        "400":
          description: Invalid id, a missing field, or a new name that's blank or over 40 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or the deck doesn't use this tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [deck-cards]
      summary: Remove a tag from every card of the deck
      parameters:
        - name: tag
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid id, or no tag given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or the deck doesn't use this tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/tags/cards:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    put:
      tags: [deck-cards]
      summary: Replace a card's tags in the deck
      description: >
        Tags are trimmed (inner spaces collapsed), must have 1 to 40
        characters, at most 20 per card, and reuse the deck's spelling of a
        tag that matches ignoring case. An empty list removes every tag of
        the card. The card is matched by name, ignoring case and " / "
        versus " // ".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCardTagsRequest"
      responses:
        "200":
          description: The card's tags, sorted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaggedCard"
        "400":
          description: Invalid id, a missing field, a blank or too long tag, or more than 20 tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or no card of this name in the deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/pending:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-cards]
      summary: List the cards waiting to be added to the collection for this deck
      description: >
        Cards picked on Scryfall for this deck but not in the collection yet,
        sorted by name. POST /deck/{id}/pending/commit creates them in the
        collection and puts them in the deck.
      responses:
        "200":
          description: OK (empty array when nothing is pending)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingCard"
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [deck-cards]
      summary: Add a card to the deck's pending list
      description: >
        When the deck already has a pending card of the same printing,
        finish and board (other than its pending commander), its quantity
        is raised instead, and that item is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPendingCardRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCard"
        "400":
          description: Invalid id or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/pending/{pending_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - name: pending_id
        in: path
        required: true
        schema:
          type: integer
        description: Pending card ID
    patch:
      tags: [deck-cards]
      summary: Change how many copies a pending card stands for, or its board
      description: >
        At least one of quantity and board is required. Moved onto a board
        that already has a pending card of the same printing and finish,
        the two are merged and the remaining item is returned. The pending
        commander can't leave the main board.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                board:
                  $ref: "#/components/schemas/DeckBoard"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCard"
        "400":
          description: Invalid id, pending_id, quantity or board, or neither quantity nor board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck or pending card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The pending card is the deck's commander and board isn't main
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [deck-cards]
      summary: Remove a card from the deck's pending list
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/InvalidID"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck or pending card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/pending/commit:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Create the pending cards in the collection and put them in the deck
      description: >
        Creates one card per copy of every pending card (or only the one
        given as pending_id), in the given storage (or without storage),
        adds each one to the deck on the board it was pending on, and
        removes it from the pending list. Without pending_id, pending cards
        on the considering board are left out. Items are handled one at a time: if something fails,
        the items already handled stay done and the rest stay pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                storage_id:
                  type: integer
                  minimum: 1
                  nullable: true
                pending_id:
                  type: integer
                  minimum: 1
                  description: Only add this pending card (all its copies) instead of the whole list.
                quantity:
                  type: integer
                  minimum: 1
                  description: >
                    With pending_id, only add this many copies; the pending
                    card keeps the rest. More than it holds adds them all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCommitSummary"
        "400":
          description: Invalid id or body, or storage_id doesn't reference an existing storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found (or not owned by the authenticated user), or unknown pending_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/import:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Add a list of cards to an existing deck
      description: >
        Adds a decklist to this deck, without ever creating cards in the
        collection. Accepts a Moxfield plain-text export ("1 Sol Ring (SLD)
        1011 *F*", resolved by set and collector number against Scryfall),
        a plain "4 Lightning Bolt" list (resolved by name, any owned
        printing can be used, missing copies are added in Scryfall's
        default printing), or a mix of both. Owned copies go in the deck
        (cards_linked), copies in no deck and of the same finish first,
        each copy used once and copies already in this deck never used
        twice; missing copies become pending cards (cards_pending). Section
        headers choose the board of the lines below them: Sideboard for
        sideboard, Maybeboard or Considering for considering, main
        otherwise. With commander_from_first_line, the first card line of
        the main board becomes the commander only if the deck has none
        yet: an owned one becomes commander_id, a missing one the pending
        commander. Moxfield tags at the end of a line ("#ramp #food
        generator") are added to that card's tags. A file starting with "{" is read as a Tamiyo deck file
        (see TamiyoFile): cards go on their boards, its commander becomes
        the deck's when it has none, and its tags are added to the deck's.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The list, one card per line, or a Tamiyo deck file.
                commander_from_first_line:
                  type: boolean
                  default: false
                  description: Treat the first line as the commander when the deck has none.
      responses:
        "200":
          description: Cards added (possibly with some lines skipped — see ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: id is not a UUID, the file is missing or can't be parsed, or commander_from_first_line is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Copy a deck into the authenticated user's decks
      description: >
        Copies one of the user's decks, or someone else's public or unlisted
        deck, into a new private deck named "<name> (copie)", with the same
        format and background. Its cards, boards, commander and tags are
        added as POST /deck/{id}/import does with a Tamiyo deck file: owned
        copies go in the copy, missing ones become pending cards. If adding
        the cards fails, the copy is removed.
      responses:
        "201":
          description: The copy was created.
          content:
            application/json:
              schema:
                type: object
                required: [deck_id, summary]
                properties:
                  deck_id:
                    type: string
                    format: uuid
                  summary:
                    $ref: "#/components/schemas/ImportSummary"
        "400":
          description: id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or someone else's private deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/collect:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    post:
      tags: [deck-cards]
      summary: Add a deck's cards to the authenticated user's collection
      description: >
        Creates cards in the user's collection from the cards of the chosen
        boards of a deck, owned and pending alike, in their exact printing
        and finish, in storage_id when given. On one of the user's own
        decks, mode "pending" adds the pending cards and puts them in the
        deck, like POST /deck/{id}/pending/commit; "all" does the same and
        also adds one more copy of every card already in the deck, which
        stays out of any deck. On someone else's public or unlisted deck,
        "all" adds every copy and "missing" only the copies the user lacks,
        counted by card name whatever the printing, every copy of the
        collection counting. Cards are handled one at a time: on a failure,
        those already added stay added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, boards]
              properties:
                mode:
                  type: string
                  enum: [all, missing, pending]
                boards:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [main, sideboard, considering]
                storage_id:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        "200":
          description: Cards added; cards_linked counts those also put in the deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            Invalid id or body, unknown mode or board, a mode not available
            for this deck, or storage_id doesn't reference an existing storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or someone else's private deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/legality:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Check a deck's legality for its own format
      description: >
        Checks every card in the deck against the deck's own format field,
        using each card's Scryfall legalities. For the "commander" format
        specifically, also checks singleton (one copy of each card by
        name, basic lands excepted) and color identity (every card within
        the commander's color identity). Nothing is persisted — computed
        fresh from Scryfall data on every call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalityReport"
        "400":
          description: >
            id is not a UUID, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /deck/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [deck-insights]
      summary: Summarize a deck's composition
      description: >
        Mana curve, color breakdown and primary card types, computed from
        Scryfall data. Lands are excluded from the mana curve, color
        breakdown and average mana value, but still counted in
        card_count, land_count and type_breakdown.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"
        "400":
          description: >
            id is not a UUID, or the deck's format isn't one
            Scryfall recognizes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks:
    get:
      tags: [shared-decks]
      summary: Browse public decks
      description: >
        Works without authentication. Lists every public deck, of every
        user; unlisted and private decks are never listed. A deck's color
        identity is its commander's, or the union of its main board's
        cards' identities without one.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Part of the deck's name, case-insensitive.
        - name: format
          in: query
          schema:
            type: string
            maxLength: 100
        - name: commander
          in: query
          schema:
            type: string
            maxLength: 100
          description: Part of the commander's name.
        - name: card
          in: query
          schema:
            type: string
            maxLength: 100
          description: Part of the name of a card on the main board, owned or pending.
        - name: owner
          in: query
          schema:
            type: string
            maxLength: 100
          description: Part of the owner's display name.
        - name: colors
          in: query
          schema:
            type: string
            pattern: "^([WUBRGwubrg]+|[Cc])$"
          description: Color identity letters, or C for colorless decks.
        - name: color_mode
          in: query
          schema:
            type: string
            enum: [exact, include, within]
            default: exact
        - name: color_count
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 5
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated, -updated, name, -name, added, -added, card_count, -card_count, likes, -likes]
            default: -updated
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPublicDecks"
        "400":
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /shared/decks/{id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: A shared deck, its owner and its cards
      description: >
        Works without authentication. Resolves only public and unlisted
        decks. Owned copies and pending cards are merged into one list,
        with no storage, proxy or ownership details.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDeck"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /shared/decks/{id}/legality:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: Legality of a shared deck
      description: >
        Same report as GET /deck/{id}/legality, without card ids. Works
        without authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalityReport"
        "400":
          description: The deck's format isn't one Scryfall recognizes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: Statistics of a shared deck
      description: Same statistics as GET /deck/{id}/stats. Works without authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"
        "400":
          description: The deck's format isn't one Scryfall recognizes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No deck has this id, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks/{id}/export:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: Export a shared deck
      description: >
        Same export as GET /deck/{id}/export, for a public or unlisted deck.
        Works without authentication.
      security: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [moxfield, plain, arena, tamiyo, cardmarket]
            default: moxfield
        - name: tags
          in: query
          required: false
          description: With format=tamiyo, include the deck's tags.
          schema:
            type: boolean
            default: false
        - name: boards
          in: query
          required: false
          description: >
            With format=cardmarket, the boards to list, comma-separated
            (main, sideboard, considering).
          schema:
            type: string
            default: main,sideboard
            example: main,sideboard,considering
        - name: pending
          in: query
          required: false
          description: With format=cardmarket, only list the pending cards.
          schema:
            type: boolean
            default: false
        - name: printings
          in: query
          required: false
          description: >
            With format=cardmarket, add each card's expansion name (Scryfall's),
            one line per card and expansion.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The deck as text, served as a download (Deck_moxfield.txt, Deck_list.txt, Deck_arena.txt, Deck_cardmarket.txt, or Deck_tamiyo.json as application/json).
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Deck_list.txt"
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/TamiyoFile"
        "400":
          description: format is unknown, tags, pending or printings isn't a boolean, or boards lists an unknown board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            No deck has this id, the id isn't a UUID, or the deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /shared/decks/{id}/compare/{other_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - name: other_id
        in: path
        required: true
        description: The deck to compare with.
        schema:
          type: string
          format: uuid
    get:
      tags: [shared-decks]
      summary: Compare two shared decks by card name
      description: >
        Same comparison as GET /deck/{id}/compare/{other_id}, for two public
        or unlisted decks. Works without authentication; mine is always
        false.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckComparison"
        "404":
          description: A deck doesn't exist, an id isn't a UUID, or a deck is private.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/SharedTooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me/preferences:
    get:
      tags: [auth]
      summary: The account's display preferences
      description: The defaults until something is saved.
      responses:
        "200":
