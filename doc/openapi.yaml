          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLikedDecks"
        "400":
          description: Invalid page or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /deck/{id}/ownership:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [shared-decks]
      summary: How many copies of each card of a deck the caller owns
      description: >
        The deck can be one of the caller's or someone else's public or
        unlisted deck. Every card of the deck is listed once, every board
        included, matched by name only (any printing or finish, " / " and
        " // " alike), counting every copy of the caller's collection.
      responses:
        "200":
          description: OK, sorted by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckOwnership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or malformed id, or someone else's private deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deck/{id}/compare/{other_id}:
    parameters:
      - $ref: "#/components/parameters/DeckID"
      - name: other_id
        in: path
        required: true
        description: The deck to compare with.
        schema:
          type: string
          format: uuid
    get:
      tags: [shared-decks]
      summary: Compare two decks by card name
      description: >
        Compares two decks card by card, matching cards by name only
        (printings and finishes are ignored; " / " and " // " in split or
        double-faced card names are equivalent). Owned copies and pending
        cards both count. Each deck can be one of the caller's, whatever
        its visibility, or anyone's public or unlisted deck. Every list is
        sorted by name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckComparison"
        "400":
          description: An id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: A deck doesn't exist, or is someone else's private deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /import/manabox:
    post:
      tags: [bulk-import]
      summary: Bulk import a ManaBox collection export
      description: >
        Imports a ManaBox_Collection.csv export. For each row, gets or
        creates the matching storage (Binder Name/Binder Type, a "deck"
        binder becoming a storage of type "deckbox"), gets or creates a
        deck too if Binder Type is "deck" (format defaults to
        "commander" — correct it afterwards with PATCH /deck/:id if
        needed), creates one card per physical copy (Quantity), and links
        deck cards accordingly. The export already carries the Scryfall ID
        directly, so this route never calls Scryfall and never returns 502.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The ManaBox_Collection.csv file. Required columns:
                    Binder Name, Binder Type, Name, Set code, Scryfall ID,
                    Collector number, Foil, Quantity (order doesn't matter).
                storage_id:
                  type: integer
                  minimum: 1
                  description: >
                    Put every card in this existing storage instead:
                    Binder Name and Binder Type are then ignored, and no
                    storage or deck is created.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file couldn't be parsed, or storage_id is
            invalid or does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /import/moxfield/collection:
    post:
      tags: [bulk-import]
      summary: Bulk import a Moxfield collection export
      description: >
        Imports a Moxfield "Export Collection" CSV. Moxfield's export has
        no storage concept, so every created card is assigned to the
        existing storage given by storage_id. It also has no Scryfall ID,
        so each row is resolved by (set, collector number) against the
        Scryfall API (https://scryfall.com/docs/api/cards/collection).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, storage_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The Moxfield collection CSV export. Required columns:
                    Count, Name, Edition, Foil, Collector Number (order
                    doesn't matter).
                storage_id:
                  type: integer
                  minimum: 1
                  description: Must reference an existing storage for this account.
      responses:
        "200":
          description: >
            Import finished (possibly with some rows skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file couldn't be parsed, or storage_id does
            not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /import/list:
    post:
      tags: [bulk-import]
      summary: Bulk import a plain card list
      description: >
        Creates one card per copy from a card list, in the storage given by
        storage_id or in no storage. Same line format as
        POST /deck/{id}/import: "1 Sol Ring (SLD) 1011 *F*" creates that
        printing (resolved by set and collector number against Scryfall),
        "4 Lightning Bolt" creates the printing Scryfall returns by default
        for that name; section headers are skipped. Lines that can't be
        resolved are skipped and reported in ImportSummary.warnings.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The list, one card per line.
                storage_id:
                  type: integer
                  minimum: 1
                  description: An existing storage for this account.
      responses:
        "200":
          description: >
            Import finished (possibly with some lines skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the list couldn't be parsed, or storage_id is
            invalid or does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /export/manabox:
    get:
      tags: [bulk-export]
      summary: Export the collection as a ManaBox CSV
      description: >
        Exports the account's collection, or only one storage with
        storage_id, as a ManaBox-compatible CSV (ManaBox_Collection_export.csv), matching the columns
        POST /import/manabox reads. Identical physical copies within the
        same storage collapse into one row with a Quantity. Cards are
        grouped by storage (ManaBox's only organizing concept); a card
        with no storage is grouped under a synthetic "Unsorted" binder
        rather than dropped. A card's deck membership is tracked
        independently of storage in Tamiyo and isn't reflected here —
        only a storage whose own type is "deckbox" is exported as
        Binder Type "deck".
      parameters:
        - name: storage_id
          in: query
          required: false
          description: Only export the cards in this storage.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="ManaBox_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: storage_id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /import/tamiyo:
    post:
      tags: [bulk-import]
      summary: Bulk import a Tamiyo collection or storage file
      description: >
        Creates one card per copy from a Tamiyo file of kind collection or
        storage, keeping each printing, finish and proxy status. Without
        storage_id, cards go in the storage named in the file (an existing
        storage with that exact name, or a new one of the file's type);
        with storage_id, they all go in that storage. Printings Scryfall
        doesn't know are skipped and reported in ImportSummary.warnings.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The Tamiyo file (JSON, see TamiyoFile).
                storage_id:
                  type: integer
                  minimum: 1
                  description: An existing storage for this account.
      responses:
        "200":
          description: >
            Import finished (possibly with some cards skipped — see
            ImportSummary.warnings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: >
            No file field, the file isn't a valid Tamiyo collection or
            storage file (a deck file is refused), or storage_id is invalid
            or does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"

  /export/tamiyo:
    get:
      tags: [bulk-export]
      summary: Export the collection or one storage as a Tamiyo file
      description: >
        Exports the account's collection (kind collection), or only one
        storage with storage_id (kind storage), as a Tamiyo file that
        POST /import/tamiyo reads back.
      parameters:
        - name: storage_id
          in: query
          required: false
          description: Only export the cards in this storage.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The Tamiyo file, served as a download (Tamiyo_Collection.json).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TamiyoFile"
        "400":
          description: storage_id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /export/moxfield/collection:
    get:
      tags: [bulk-export]
      summary: Export the collection as a Moxfield collection CSV
      description: >
        Exports the account's collection, or only one storage with
        storage_id, as a Moxfield-compatible "Export Collection" CSV, matching the columns
        POST /import/moxfield/collection reads. Identical physical copies
        collapse into one row with a Count. Moxfield's format has no
        storage concept, so — unlike the ManaBox export — cards are
        grouped across every storage (and unsorted cards) without
        distinction.
      parameters:
        - name: storage_id
          in: query
          required: false
          description: Only export the cards in this storage.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The CSV file, served as a download.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Moxfield_Collection_export.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: storage_id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: storage_id does not reference an existing storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /deck/{id}/export:
    parameters:
      - $ref: "#/components/parameters/DeckID"
    get:
      tags: [bulk-export]
      summary: Export one deck as text, in a chosen format
      description: >
        Exports the deck's cards, pending ones included, as plain text, or
        as a Tamiyo deck file with format=tamiyo (with the deck's tags when
        tags=true). cardmarket: a list for a Cardmarket wants list, the cards
        of the boards listed in boards, main and sideboard by default (only
        the pending ones with pending=true), one
        line per card name, "4 Dark Ritual", or per card and expansion with
        printings=true, "2 Dark Confidant (Modern Masters)", expansion names
        being Scryfall's.
        moxfield: one line per printing, "1 Sol Ring (SLD) 1011 *F*", the
        commander's line first with its full quantity, the rest sorted
        alphabetically, so importing the file back reconstructs the same
        commander. plain: one line per card name, "4 Lightning Bolt",
        the commander first. arena: MTG Arena's format, a "Commander"
        section (when the deck has one) then a "Deck" section, one line per
        card name, split cards written with " // ". The sideboard follows in
        a section of its own ("SIDEBOARD:" in moxfield, "Sideboard"
        otherwise), then the considered cards ("MAYBEBOARD:" in moxfield,
        "Maybeboard" in plain, left out of arena), each section only when
        it has cards.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [moxfield, plain, arena, tamiyo, cardmarket]
            default: moxfield
        - name: tags
          in: query
          required: false
          description: With format=tamiyo, include the deck's tags.
          schema:
            type: boolean
            default: false
        - name: boards
          in: query
          required: false
          description: >
            With format=cardmarket, the boards to list, comma-separated
            (main, sideboard, considering).
          schema:
            type: string
            default: main,sideboard
            example: main,sideboard,considering
        - name: pending
          in: query
          required: false
          description: With format=cardmarket, only list the pending cards.
          schema:
            type: boolean
            default: false
        - name: printings
          in: query
          required: false
          description: >
            With format=cardmarket, add each card's expansion name (Scryfall's),
            one line per card and expansion.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The deck as text, served as a download (Deck_moxfield.txt, Deck_list.txt, Deck_arena.txt, Deck_cardmarket.txt, or Deck_tamiyo.json as application/json).
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Deck_list.txt"
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/TamiyoFile"
        "400":
          description: id is not a UUID, format is unknown, tags, pending or printings isn't a boolean, or boards lists an unknown board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deck not found, or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token returned by /auth/register, /auth/login or
        /auth/refresh. Short-lived (JWT_ACCESS_TOKEN_TTL_MINUTES,
        15 minutes by default) — use /auth/refresh to obtain a new one
        without logging in again.

  headers:
    RefreshCookie:
      description: >
        tamiyo_refresh_token=<refresh token>; HttpOnly; SameSite=Strict;
        Secure (unless REFRESH_COOKIE_SECURE=false); Path=<API_BASE_PATH>/auth;
        Max-Age = JWT_REFRESH_TOKEN_TTL_DAYS. Lets a browser client keep the
        refresh token out of reach of JavaScript.
      schema:
        type: string

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefreshTokenTransport:
      name: X-Refresh-Token-Transport
      in: header
      required: false
      schema:
        type: string
        enum: [cookie]
      description: >
        "cookie" for browser clients that keep the refresh token in the
        httpOnly cookie only: the response body then leaves refresh_token
        out, so a script injected in the page can't read it.
    RefreshCookie:
      name: tamiyo_refresh_token
      in: cookie
      required: false
      schema:
        type: string
      description: >
        Refresh token set by /auth/register, /auth/login and /auth/refresh.
        Used when the request body carries no refresh_token.
    CardID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID
    StorageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Storage ID
    DeckID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Deck ID (a UUID)
    CardIDPath:
      name: card_id
      in: path
      required: true
      schema:
        type: integer
      description: Card ID
    ConnectionsPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    ConnectionsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24

  responses:
    LikeDeckNotFound:
      description: Unknown or malformed deck id, or someone else's private deck
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FollowBadRequest:
      description: id is not a UUID, invalid page or limit, or following yourself
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UserNotFound:
      description: No such user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidID:
      description: id is not a valid integer (a UUID for decks)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server/database error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >
        Too many requests from this client IP on /auth/register,
        /auth/login, and /auth/forgot-password combined
        (AUTH_RATE_LIMIT_MAX per AUTH_RATE_LIMIT_WINDOW_SECONDS, 5 per 60s
        by default). A Retry-After header (seconds) indicates when to
        retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SharedTooManyRequests:
      description: >
        Too many requests from this client IP on the /shared/decks routes
        combined (SHARE_RATE_LIMIT_MAX per SHARE_RATE_LIMIT_WINDOW_SECONDS,
        60 per 60s by default). A Retry-After header (seconds) indicates
        when to retry.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: >
        A bulk import couldn't reach or parse a response from the
        Scryfall API while resolving Moxfield rows.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Preferences:
      type: object
      properties:
        show_collection_in_decks:
          type: boolean
          default: true
          description: >
            Whether deck pages show what the collection holds: pending cards
            and storages in the user's own decks, owned cards in other
            people's decks.
      required: [show_collection_in_decks]

    DeckOwnership:
      type: object
      properties:
        cards:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              owned:
                type: integer
                minimum: 0
            required: [name, owned]
      required: [cards]

    TamiyoFile:
      type: object
      description: >
        Tamiyo's own versioned file format, for a collection, a storage or
        a deck. Collection and storage files list storages and cards with
        their storage and proxy status; deck files have a deck object,
        cards with their board and commander flag, and optionally tags.
      properties:
        tamiyo:
          type: integer
          description: Format version, currently 1.
        kind:
          type: string
          enum: [collection, storage, deck]
        exported_at:
          type: string
          format: date-time
        deck:
          type: object
          properties:
            name:
              type: string
            format:
              type: string
        storages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
            required: [name, type]
        cards:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              scryfall_id:
                type: string
                format: uuid
              set_code:
                type: string
              collector_number:
                type: string
              foil:
                type: boolean
              proxy:
                type: boolean
                description: Collection and storage files only.
              quantity:
                type: integer
                minimum: 1
                maximum: 1000
              storage:
                type: string
                nullable: true
                description: Collection and storage files only; the name of one of the storages, null for no storage.
              board:
                $ref: "#/components/schemas/DeckBoard"
              commander:
                type: boolean
                description: Deck files only.
            required: [name, scryfall_id, quantity]
        tags:
          type: array
          description: Deck files exported with their tags only.
          items:
            $ref: "#/components/schemas/TaggedCard"
      required: [tamiyo, kind, cards]

    DeckBoard:
      type: string
      enum: [main, sideboard, considering]
      default: main
      description: >
        Where a card sits in its deck: the deck itself, its sideboard, or the
        cards being considered for it. Only main counts in card counts,
        statistics, the deck size and comparisons.

    DeckCard:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
          properties:
            board:
              $ref: "#/components/schemas/DeckBoard"
          required: [board]

    LegalityIssue:
      type: object
      properties:
        card_id:
          type: integer
        card_name:
          type: string
          description: Empty for an issue about the whole deck, such as its size.
        board:
          $ref: "#/components/schemas/DeckBoard"
        reason:
          type: string
      required: [card_name, reason]

    LegalityReport:
      type: object
      properties:
        format:
          type: string
        legal:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/LegalityIssue"
      required: [format, legal]

    ManaCurveBucket:
      type: object
      properties:
        mana_value:
          type: integer
        count:
          type: integer
      required: [mana_value, count]

    DeckStats:
      type: object
      properties:
        card_count:
          type: integer
        land_count:
          type: integer
        nonland_count:
          type: integer
        average_mana_value:
          type: number
        mana_curve:
          type: array
          items:
            $ref: "#/components/schemas/ManaCurveBucket"
        color_breakdown:
          type: object
          additionalProperties:
            type: integer
        type_breakdown:
          type: object
          additionalProperties:
            type: integer
      required: [card_count, land_count, nonland_count, average_mana_value, mana_curve, color_breakdown, type_breakdown]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Optional cosmetic name, trimmed; blank means none.
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    TokenPair:
      type: object
      properties:
        token:
          type: string
          description: 'Short-lived JWT access token. Send as "Authorization: Bearer <token>".'
        refresh_token:
          type: string
          description: >
            Long-lived opaque token. Send to /auth/refresh to obtain a new
            token pair, or to /auth/logout to end this session. Omitted when
            the request sent "X-Refresh-Token-Transport: cookie": the token
            is then only in the tamiyo_refresh_token cookie.
      required: [token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Optional when the tamiyo_refresh_token cookie is sent.

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [current_password, new_password]

    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Cosmetic name shown instead of the email, null until set.
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: Scryfall card whose art crop is the avatar, null until set.
      required: [id, email, display_name, avatar_scryfall_id]

    PublicDeck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
        background_scryfall_id:
          type: string
          format: uuid
          nullable: true
        commander_scryfall_id:
          type: string
          format: uuid
          nullable: true
        commander_name:
          type: string
          nullable: true
        color_identity:
          type: string
          description: In WUBRG order, empty for a colorless deck.
        card_count:
          type: integer
          description: Cards of the main board, pending ones included.
        likes_count:
          type: integer
          description: How many users liked the deck.
        owner:
          $ref: "#/components/schemas/Profile"
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, background_scryfall_id, commander_scryfall_id, commander_name, color_identity, card_count, likes_count, owner, added, updated]

    LikedDeck:
      allOf:
        - $ref: "#/components/schemas/PublicDeck"
        - type: object
          required: [liked_at]
          properties:
            liked_at:
              type: string
              description: When you liked the deck.

    PaginatedLikedDecks:
      type: object
      required: [data, page, limit, total, total_pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LikedDeck"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    LikeStatus:
      type: object
      required: [likes_count, liked_by_me]
      properties:
        likes_count:
          type: integer
        liked_by_me:
          type: boolean

    PaginatedPublicDecks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicDeck"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    FollowStatus:
      type: object
      required: [followers_count, following_count, followed_by_me, follows_me]
      properties:
        followers_count:
          type: integer
        following_count:
          type: integer
        followed_by_me:
          type: boolean
          description: The caller follows this user.
        follows_me:
          type: boolean
          description: This user follows the caller.

    Connection:
      type: object
      required: [id, display_name, avatar_scryfall_id, since, followed_by_me]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
        since:
          type: string
          format: date-time
          description: When this follow started.
        followed_by_me:
          type: boolean
          description: The caller follows this user.

    PaginatedConnections:
      type: object
      required: [data, page, limit, total, total_pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Profile:
      type: object
      description: What any signed-in user can see of another user; never the email.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
      required: [id, display_name, avatar_scryfall_id]

    UpdateMeRequest:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 32
          description: Trimmed; null or a blank string clears it.
        avatar_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: Scryfall card id whose art crop becomes the avatar; null or a blank string clears it.

    ChangeEmailRequest:
      type: object
      properties:
        current_password:
          type: string
        new_email:
          type: string
          format: email
      required: [current_password, new_email]

    ConfirmEmailRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
      required: [token, new_password]

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        proxy:
          type: boolean
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          nullable: true
        mana_value:
          type: number
          description: Converted mana cost (CMC).
        colors:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            The card's colors as WUBRG letters in that order ("WR" for a
            Boros card), empty for a colorless card, null when not known yet
            (see POST /cards/refresh-details).
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
          description: >
            Primary type, from the type line of the front face (lands first, then creatures,
            planeswalkers...). null when not known yet.
        color_identity:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            Color identity as WUBRG letters in that order, empty for a
            colorless card, null when not known yet (see
            POST /cards/refresh-details).
        added:
          type: string
        updated:
          type: string
        quantity:
          type: integer
          description: Only with GET /cards?stack=true, the number of copies in the stack.
        copy_ids:
          type: array
          items:
            type: integer
          description: Only with GET /cards?stack=true, the ids of the stack's copies, lowest first.
      required:
        - id
        - name
        - scryfall_id
        - set_code
        - collector_number
        - foil
        - mana_value
        - added
        - updated

    PendingCard:
      type: object
      properties:
        id:
          type: integer
        deck_id:
          type: string
          format: uuid
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
        mana_value:
          type: number
        colors:
          type: string
          nullable: true
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          nullable: true
        board:
          $ref: "#/components/schemas/DeckBoard"
        added:
          type: string
        owned_copies:
          type: integer
          description: >
            Cards of the same name in the collection, any printing, outside
            this deck (copies in other decks count). Only computed by
            GET /deck/{id}/pending, 0 elsewhere.
        owned_same_printing:
          type: integer
          description: >
            Among them, the copies of this exact printing. Only computed by
            GET /deck/{id}/pending, 0 elsewhere.
      required: [id, deck_id, name, scryfall_id, set_code, collector_number, foil, quantity, mana_value, board, added, owned_copies, owned_same_printing]

    AddPendingCardRequest:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        mana_value:
          type: number
          minimum: 0
        colors:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
        board:
          $ref: "#/components/schemas/DeckBoard"
      required: [name, scryfall_id, set_code, collector_number]

    PendingCommitSummary:
      type: object
      properties:
        cards_created:
          type: integer
      required: [cards_created]

    DetailsRefreshSummary:
      type: object
      properties:
        updated:
          type: integer
          description: Cards whose details were filled in.
        not_found:
          type: integer
          description: Cards Scryfall didn't know (their details stay unknown).
        remaining:
          type: integer
          description: Cards still missing details after this batch.
        next_after_id:
          type: integer
          nullable: true
          description: after_id to send on the next call, null when there is nothing left.
      required: [updated, not_found, remaining, next_after_id]

    DeleteAllCardsResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of cards deleted.
      required: [deleted]

    PaginatedCards:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateCardRequest:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
          default: false
        proxy:
          type: boolean
          default: false
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          nullable: true
          minimum: 1
        mana_value:
          type: number
          minimum: 0
          default: 0
          description: >
            Converted mana cost (CMC). Not fetched automatically from
            Scryfall — supplied by the client, same as name or set_code.
        colors:
          type: string
          nullable: true
          pattern: "^W?U?B?R?G?$"
          description: >
            WUBRG letters (any case and order, normalized to WUBRG order),
            empty for colorless. Optional: left unknown when omitted.
        card_type:
          type: string
          nullable: true
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
          description: Primary type. Optional, left unknown when omitted.
        color_identity:
          type: string
          nullable: true
          pattern: "^[WUBRGwubrg]*$"
          description: >
            WUBRG letters (any case and order, normalized to WUBRG order),
            empty for colorless. Optional: left unknown when omitted.
      required:
        - name
        - scryfall_id
        - set_code
        - collector_number

    UpdateCardRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        proxy:
          type: boolean
          description: A printed stand-in rather than a real copy.
        storage_id:
          type: integer
          minimum: 1
          nullable: true
          description: >
            Moves the card to this storage. null removes the card from its
            storage; leaving the field out keeps the current one.
        mana_value:
          type: number
          minimum: 0
        colors:
          type: string
          pattern: "^[WUBRGwubrg]*$"
        card_type:
          type: string
          enum: [Creature, Planeswalker, Battle, Instant, Sorcery, Artifact, Enchantment, Land, Other]
        color_identity:
          type: string
          pattern: "^[WUBRGwubrg]*$"

    Storage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        card_count:
          type: integer
        added:
          type: string
        updated:
          type: string
      required: [id, name, type, card_count, added, updated]

    PaginatedStorages:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Storage"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateStorageRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required: [name, type]

    UpdateStorageRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        type:
          type: string

    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            Random identifier generated when the deck is created. It is also
            the id of the deck's read-only page (GET /shared/decks/{id}),
            which only resolves while the deck is public or unlisted.
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          nullable: true
        commander_pending_id:
          type: integer
          nullable: true
          description: >
            The commander when it's one of the deck's pending cards (not in
            the collection yet). At most one of commander_id and
            commander_pending_id is set.
        background_scryfall_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Scryfall id of the printing whose art (art_crop) is shown behind
            the deck, null when none was chosen.
        commander_scryfall_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: Scryfall id of the commander card, null without a commander.
        visibility:
          $ref: "#/components/schemas/DeckVisibility"
        card_count:
          type: integer
          description: Cards of the main board.
        pending_count:
          type: integer
          description: Copies waiting in the main board's pending list (not in the collection yet), not counted in card_count.
        likes_count:
          type: integer
          description: How many users liked the deck.
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, visibility, card_count, added, updated]

    SharedDeckInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
        visibility:
          type: string
          enum: [public, unlisted]
        background_scryfall_id:
          type: string
          format: uuid
          nullable: true
        commander_scryfall_id:
          type: string
          format: uuid
          nullable: true
        card_count:
          type: integer
          description: Every card of the main board, owned or pending.
        likes_count:
          type: integer
          description: How many users liked the deck.
        added:
          type: string
        updated:
          type: string
      required: [id, name, format, visibility, background_scryfall_id, commander_scryfall_id, card_count, likes_count, added, updated]

    SharedDeckCard:
      type: object
      description: One printing of a card in a shared deck, with how many copies the deck holds.
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          format: uuid
        set_code:
          type: string
        collector_number:
          type: string
        foil:
          type: boolean
        quantity:
          type: integer
          minimum: 1
        mana_value:
          type: number
        colors:
          type: string
          nullable: true
        card_type:
          type: string
          nullable: true
        color_identity:
          type: string
          nullable: true
        commander:
          type: boolean
          description: True for the deck's commander, which is always listed on its own.
        board:
          $ref: "#/components/schemas/DeckBoard"
        tags:
          type: array
          description: The owner's tags for this card, shared by every printing.
          items:
            type: string
      required: [name, scryfall_id, set_code, collector_number, foil, quantity, mana_value, colors, card_type, color_identity, commander, board, tags]

    SharedDeck:
      type: object
      properties:
        deck:
          $ref: "#/components/schemas/SharedDeckInfo"
        owner:
          $ref: "#/components/schemas/Profile"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/SharedDeckCard"
      required: [deck, owner, cards]

    ComparedDeck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
        visibility:
          type: string
          enum: [private, unlisted, public]
        owner:
          $ref: "#/components/schemas/Profile"
        mine:
          type: boolean
          description: Whether the deck belongs to the caller.
        card_count:
          type: integer
          description: Every card of the main board, pending ones included.
      required: [id, name, format, visibility, owner, mine, card_count]

    ComparedCard:
      type: object
      properties:
        name:
          type: string
        scryfall_id:
          type: string
          description: One of the matching printings, preferring the first deck's.
        mana_value:
          type: number
        colors:
          type: string
          nullable: true
        card_type:
          type: string
          nullable: true
        color_identity:
          type: string
          nullable: true
        quantity:
          type: integer
          description: Copies in the first deck (0 when only in the other).
        other_quantity:
          type: integer
          description: Copies in the other deck (0 when only in the first).
        commander:
          type: boolean
        other_commander:
          type: boolean
        tags:
          type: array
          description: The card's tags in the first deck.
          items:
            type: string
        other_tags:
          type: array
          description: The card's tags in the other deck.
          items:
            type: string
      required: [name, scryfall_id, mana_value, colors, card_type, color_identity, quantity, other_quantity, commander, other_commander, tags, other_tags]

    DeckComparison:
      type: object
      properties:
        deck:
          $ref: "#/components/schemas/ComparedDeck"
        other:
          $ref: "#/components/schemas/ComparedDeck"
        common:
          type: array
          items:
            $ref: "#/components/schemas/ComparedCard"
        only_in_deck:
          type: array
          items:
            $ref: "#/components/schemas/ComparedCard"
        only_in_other:
          type: array
          items:
            $ref: "#/components/schemas/ComparedCard"
      required: [deck, other, common, only_in_deck, only_in_other]

    DeckView:
      type: object
      properties:
        grouping:
          type: string
          nullable: true
          enum: [type, color, mana, storage, tag]
          description: null for no grouping.
        sort:
          type: string
          enum: [name, -name, added, -added, updated, -updated, mana_value, -mana_value]
        collapsed_boards:
          type: array
          description: >
            The boards folded on the deck page, among sideboard and
            considering. Always returned; optional when saving, where
            leaving it out means [considering].
          items:
            type: string
            enum: [sideboard, considering]
      required: [grouping, sort]

    TaggedCard:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
      required: [name, tags]

    DeckTags:
      type: object
      properties:
        tags:
          type: array
          description: Every tag used in the deck.
          items:
            type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/TaggedCard"
      required: [tags, cards]

    SetCardTagsRequest:
      type: object
      properties:
        name:
          type: string
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40
      required: [name, tags]

    RenameTagRequest:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
          maxLength: 40
      required: [from, to]

    PaginatedDecks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deck"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [data, page, limit, total, total_pages]

    CreateDeckRequest:
      type: object
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
        background_scryfall_id:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/DeckVisibility"
      required: [name, format]

    UpdateDeckRequest:
      type: object
      description: All fields optional; only included fields are modified.
      properties:
        name:
          type: string
        format:
          type: string
        commander_id:
          type: integer
          minimum: 1
        commander_pending_id:
          type: integer
          minimum: 1
          description: >
            Make one of the deck's pending cards the commander (clears
            commander_id). Setting commander_id clears it in turn.
        clear_commander_id:
          type: boolean
          description: Set to true to explicitly clear commander_id (set it to null).
        background_scryfall_id:
          type: string
          format: uuid
        clear_background_scryfall_id:
          type: boolean
          description: Set to true to remove the chosen art (set background_scryfall_id to null).
        visibility:
          $ref: "#/components/schemas/DeckVisibility"

    DeckVisibility:
      type: string
      enum: [private, unlisted, public]
      default: unlisted
      description: >
        Who may see the deck once decks can be shared: only its owner
        (private), anyone with its link (unlisted), or anyone, listed when
        browsing decks (public). No effect yet: deck routes only serve the
        owner's decks.

    ImportSummary:
      type: object
      description: >
        Result of a bulk import. A malformed or unresolvable row never
        aborts the whole import — it's recorded as a skipped card with a
        warning instead.
      properties:
        cards_created:
          type: integer
        cards_linked:
          type: integer
          description: Deck import only — copies from the collection put in the deck.
        cards_pending:
          type: integer
          description: Deck import only — copies added to the deck's pending cards.
        cards_skipped:
          type: integer
        storages_created:
          type: integer
        decks_created:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: Omitted entirely when there are no warnings.
